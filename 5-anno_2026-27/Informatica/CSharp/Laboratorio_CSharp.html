<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Laboratorio C# Biblioteca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: banco di lavoro come un IDE. A sinistra l'albero dei moduli (Esplora soluzioni),
   al centro il modulo aperto, in basso la barra di stato che conta gli esercizi superati. */
:root {
  --bg: #F4F5FA;
  --surface: #FFFFFF;
  --sunken: #EBEDF5;
  --ink: #1A1D3A;
  --muted: #565C7C;
  --line: #D6D9E7;
  --accent: #5232D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #ECE8FD;
  --ok: #17784A;
  --ok-soft: #E2F3E9;
  --err: #C42B2B;
  --err-soft: #FBE6E6;
  --warn: #8A5D00;
  --warn-soft: #FCF1D6;
  /* colori del tema chiaro di Visual Studio */
  --code-bg: #FFFFFF;
  --code-ink: #1F1F1F;
  --c-kw: #0000FF;
  --c-type: #2B91AF;
  --c-str: #A31515;
  --c-com: #008000;
  --c-num: #098658;
  --status: #5232D6;
  --status-ink: #FFFFFF;
  /* la finestra simulata resta una form Windows chiara in entrambi i temi */
  --win-bg: #F0F0F0;
  --win-ink: #000000;
  --win-line: #ADADAD;
  --win-btn: #E1E1E1;
  --win-btn-hover: #E5F1FB;
  --win-btn-line-hover: #0078D7;
  --win-sel: #0078D7;
  --win-sel-ink: #FFFFFF;
  --win-white: #FFFFFF;
  --win-head: #F7F7F7;
  --win-title: #FFFFFF;
  --win-muted: #6D6D6D;
  --shadow: 0 1px 2px rgba(26, 29, 58, .06), 0 8px 24px rgba(26, 29, 58, .08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --side-w: 288px;
  --status-h: 30px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14152B; --surface: #1C1E38; --sunken: #181A33; --ink: #E7E8F5; --muted: #A2A6C4; --line: #33365A;
    --accent: #A08FFF; --accent-ink: #14152B; --accent-soft: #2A2652;
    --ok: #4CC38A; --ok-soft: #15372A; --err: #FF8080; --err-soft: #3E1F28; --warn: #F2C14E; --warn-soft: #3A3020;
    --code-bg: #1E1E1E; --code-ink: #D4D4D4; --c-kw: #569CD6; --c-type: #4EC9B0; --c-str: #D69D85; --c-com: #57A64A; --c-num: #B5CEA8;
    --status: #5B3FDA; --status-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14152B; --surface: #1C1E38; --sunken: #181A33; --ink: #E7E8F5; --muted: #A2A6C4; --line: #33365A;
  --accent: #A08FFF; --accent-ink: #14152B; --accent-soft: #2A2652;
  --ok: #4CC38A; --ok-soft: #15372A; --err: #FF8080; --err-soft: #3E1F28; --warn: #F2C14E; --warn-soft: #3A3020;
  --code-bg: #1E1E1E; --code-ink: #D4D4D4; --c-kw: #569CD6; --c-type: #4EC9B0; --c-str: #D69D85; --c-com: #57A64A; --c-num: #B5CEA8;
  --status: #5B3FDA; --status-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 4.4vw, 42px); font-weight: 700; }
h2 { font-size: clamp(24px, 3vw, 30px); font-weight: 700; }
h3 { font-size: 20px; font-weight: 600; }
h4 { font-size: 16.5px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
code, kbd, .mono { font-family: var(--f-code); font-size: 0.88em; }
p code, li code, td code, .fb code, .msg code {
  background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere;
}
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
ul, ol { margin: 0; padding-left: 1.3em; }
li + li { margin-top: 4px; }

/* ---------- impalcatura ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px);
  height: calc(100vh - var(--status-h) - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px));
  overflow-y: auto; background: var(--sunken); border-right: 1px solid var(--line);
  padding-block: 20px 24px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 13px; }
.tree-title { font-size: 12.5px; color: var(--muted); padding: 0 8px; font-weight: 600; }
.tree { display: flex; flex-direction: column; gap: 2px; list-style: none; padding: 0; margin: 0; }
.tree li + li { margin-top: 0; }
.tree button {
  width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 6px;
  text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 7px; cursor: pointer;
  font-size: 14.5px; transition: background-color 150ms ease;
}
.tree button:hover { background: var(--surface); }
.tree button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.tree .n { font-family: var(--f-code); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tree .p { font-family: var(--f-code); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tree .p.full { color: var(--ok); font-weight: 600; }
.tree .grp { font-size: 12px; color: var(--muted); padding: 10px 8px 4px; font-weight: 600; }
.side-foot { margin-top: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 13px; text-align: left; }

.main {
  min-width: 0;
  padding-block: 36px calc(var(--status-h) + 72px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page > * { min-width: 0; }
.mod-head { display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
.mod-head .kicker { font-family: var(--f-code); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.mod-head .lead { font-size: 17px; color: var(--muted); max-width: 64ch; }
.page h3 { margin-top: 14px; }
.page > p { max-width: 70ch; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }

.topbar { display: none; }

.status {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--status); color: var(--status-ink);
  min-height: calc(var(--status-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-family: var(--f-body);
}
.status .seg { display: flex; align-items: center; gap: 6px; padding: 0 10px; height: var(--status-h); white-space: nowrap; }
.status .seg + .seg { border-left: 1px solid rgba(255, 255, 255, .22); }
.status .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.status .bar { width: 90px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .25); overflow: hidden; }
.status .bar i { display: block; height: 100%; width: 0; background: #FFFFFF; transition: width 300ms var(--ease-out); }
.status button {
  border: 0; background: rgba(255, 255, 255, .14); color: var(--status-ink); border-radius: 4px; padding: 3px 10px;
  cursor: pointer; font-size: 12.5px; font-weight: 600; transition: background-color 150ms ease, transform 140ms var(--ease-out);
}
.status button:hover { background: rgba(255, 255, 255, .26); }
.status button:active { transform: scale(0.97); }

/* ---------- elementi di testo ---------- */
.note { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.note.warn { background: var(--warn-soft); border-color: transparent; }
.note.tip { background: var(--accent-soft); border-color: transparent; }
.note b.t { font-family: var(--f-display); font-size: 15.5px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.cols > * { min-width: 0; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 13.5px; color: var(--muted); background: var(--sunken); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
details.more { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details.more > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
details.more > div { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- codice ---------- */
.code {
  margin: 0; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; font-family: var(--f-code); font-size: 13.5px; line-height: 1.6;
  white-space: pre; tab-size: 4;
}
.code.tight { padding: 10px 12px; font-size: 13px; }
.k { color: var(--c-kw); } .ty { color: var(--c-type); } .s { color: var(--c-str); } .c { color: var(--c-com); } .nu { color: var(--c-num); }
.codebox { position: relative; }
.copy {
  position: absolute; top: 8px; right: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-size: 12px; border-radius: 5px; padding: 2px 8px; cursor: pointer; transition: transform 140ms var(--ease-out);
}
.copy:active { transform: scale(0.96); }
input.blank {
  font: inherit; color: var(--code-ink); background: var(--accent-soft); border: 0; border-bottom: 2px dashed var(--accent);
  border-radius: 3px 3px 0 0; padding: 0 3px; margin: 0 1px; min-width: 2ch;
  transition: background-color 150ms ease, border-color 150ms ease;
}
input.blank:focus { outline: none; border-bottom-style: solid; }
input.blank.ok { background: var(--ok-soft); border-bottom: 2px solid var(--ok); }
input.blank.bad { background: var(--err-soft); border-bottom: 2px solid var(--err); }

/* ---------- esercizi ---------- */
.ex { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.ex-h { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ex-h h4 { flex: 1; min-width: 200px; }
.tag { font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.done-badge {
  font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--ok-soft); color: var(--ok);
  white-space: nowrap; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
}
.done-badge[data-on="0"] { opacity: 0; transform: scale(0.95); }
.ex .q { max-width: 70ch; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  font: 600 14px var(--f-body); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); cursor: pointer; transition: transform 140ms var(--ease-out), background-color 150ms ease, border-color 150ms ease;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
.fb { font-size: 14.5px; max-width: 70ch; display: flex; flex-direction: column; gap: 8px; }
.fb:empty { display: none; }
.fb .ok { color: var(--ok); font-weight: 600; }
.fb .bad { color: var(--err); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 14px; cursor: pointer;
  display: flex; gap: 10px; align-items: flex-start; transition: border-color 150ms ease, background-color 150ms ease, transform 140ms var(--ease-out);
}
.opt:hover { border-color: var(--accent); }
.opt:active { transform: scale(0.99); }
.opt .l { font-family: var(--f-code); font-size: 13px; color: var(--muted); padding-top: 1px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--err); background: var(--err-soft); }
.opt code { white-space: pre-wrap; }
.why { font-size: 14.5px; border-left: 3px solid var(--line); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 6px; }
.why.okc { border-left-color: var(--ok); }
.why.badc { border-left-color: var(--err); }

.bugcode { background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; overflow-x: auto; }
.bugline {
  display: flex; gap: 12px; width: 100%; min-width: max-content; text-align: left; border: 0; background: transparent; cursor: pointer;
  font-family: var(--f-code); font-size: 13.5px; line-height: 1.6; padding: 0 14px; white-space: pre; transition: background-color 120ms ease;
}
.bugline:hover { background: var(--accent-soft); }
.bugline .ln { color: var(--muted); width: 2ch; text-align: right; user-select: none; flex: none; }
.bugline.miss { background: var(--warn-soft); }
.bugline.hit { background: var(--err-soft); text-decoration: underline wavy var(--err); text-underline-offset: 4px; }

.order { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.order li { margin: 0; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--surface); transition: border-color 150ms ease, background-color 150ms ease; }
.order li.bad { border-color: var(--err); background: var(--err-soft); }
.order li.good { border-color: var(--ok); background: var(--ok-soft); }
.order .pos { font-family: var(--f-code); font-size: 13px; color: var(--muted); text-align: center; }
.order .mv { display: flex; gap: 4px; }
.order .mv button { width: 32px; height: 30px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; transition: transform 140ms var(--ease-out); }
.order .mv button:active { transform: scale(0.94); }
.calc input, .field input, .field select {
  font: 500 15px var(--f-code); padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 140px;
}
.checklist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checklist li { margin: 0; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.checklist input { margin-top: 5px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }

/* scrittura libera e correttore */
textarea.editor {
  width: 100%; min-height: 260px; resize: vertical; font-family: var(--f-code); font-size: 13.5px; line-height: 1.55; tab-size: 4;
  background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
}
textarea.editor:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.checks li { margin: 0; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.checks .i { font-weight: 700; }
.checks .y .i { color: var(--ok); }
.checks .n .i { color: var(--err); }
.checks .w .i { color: var(--warn); }
.checks .h { color: var(--muted); font-size: 13.5px; display: block; }
.score { font-family: var(--f-code); font-size: 13px; color: var(--muted); }
.ai { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--sunken); display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; }
.ai .who { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.msg { display: flex; flex-direction: column; gap: 8px; }
.msg h4 { font-size: 15px; margin-top: 4px; }
.msg pre.code { font-size: 12.5px; }
.msg ul { display: flex; flex-direction: column; gap: 2px; }
.thinking { color: var(--muted); font-style: italic; }

/* tabs */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button {
  border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-family: var(--f-code); font-size: 13px; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 150ms ease, border-color 150ms ease;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); margin-left: 6px; vertical-align: middle; }
.tabs button .dot.y { background: var(--ok); }

/* traccia interattiva */
.traccia { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.paper {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; font-size: 14.5px; line-height: 1.75;
  display: flex; flex-direction: column; gap: 10px;
}
.paper h4 { font-family: var(--f-body); font-size: 14.5px; font-weight: 600; }
.paper ul { list-style: "• "; }
.mark {
  background: var(--accent-soft); color: inherit; padding: 1px 3px; border-radius: 4px; cursor: pointer;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  box-shadow: inset 0 -2px 0 var(--accent); transition: background-color 150ms ease;
}
.mark:hover, .mark[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mark.seen:not([aria-pressed="true"]) { box-shadow: inset 0 -2px 0 var(--ok); }
.explain { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 10px; }
.explain .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 22px; font-size: 14.5px; }
.explain .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.explain .card .quote { font-size: 13.5px; color: var(--muted); font-style: italic; }

/* figure */
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
figure .svgwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
figure svg { display: block; width: 100%; height: auto; min-width: 620px; color: var(--ink); }
figcaption { font-size: 13.5px; color: var(--muted); max-width: 70ch; }

/* ---------- simulatore Windows Forms ---------- */
.sim { display: flex; flex-direction: column; gap: 14px; }
.sim-toggles { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }

ss Libro : Risorsa\n    {\n        public int NumeroPagine { get; set; }\n\n        public Libro(string codice, string titolo, string autore, int giorniPrestito, int numeroPagine)\n            : base(codice, titolo, autore, giorniPrestito)\n        {\n            NumeroPagine = numeroPagine;\n        }\n\n        public override string StampaDettagli()\n        {\n            return \"[LIBRO] \" + base.StampaDettagli() + $\" | Pagine: {NumeroPagine}\";\n        }\n\n        // penale base (giorni * 0.20) + 5 euro di tassa fissa\n        public override double CalcolaPenaleRitardo()\n        {\n            return base.CalcolaPenaleRitardo() + 5.00;\n        }\n    }\n}\n", "bibcon/Libro.cs": "namespace Biblioteca\n{\n    public class Libro : Risorsa\n    {\n        public int NumeroPagine { get; set; }\n\n        public Libro(string codice, string titolo, string autore, int giorniPrestito, int numeroPagine)\n            : base(codice, titolo, autore, giorniPrestito)\n        {\n            NumeroPagine = numeroPagine;\n        }\n\n        public override string StampaDettagli()\n        {\n            return \"[LIBRO] \" + base.StampaDettagli() + $\" | Pagine: {NumeroPagine}\";\n        }\n\n        // penale base (giorni * 0.20) + 5 euro di tassa fissa\n        public override double CalcolaPenaleRitardo()\n        {\n            return base.CalcolaPenaleRitardo() + 5.00;\n        }\n    }\n}\n", "bib/Audiolibro.cs": "namespace LibreriaBiblioteca\n{\n    public class Audiolibro : Risorsa\n    {\n        public int DurataMinuti { get; set; }\n\n        public Audiolibro(string codice, string titolo, string autore, int giorniPrestito, int durataMinuti)\n            : base(codice, titolo, autore, giorniPrestito)\n        {\n            DurataMinuti = durataMinuti;\n        }\n\n        public override string StampaDettagli()\n        {\n            return \"[AUDIOLIBRO] \" + base.StampaDettagli() + $\" | Durata: {DurataMinuti} min\";\n        }\n\n        // NON si us /* ============================================================
   Correttore del codice C#. Funzioni pure: girano nel browser e,
   in fase di build, anche in node per verificarle sulle soluzioni vere.

// Restituisce due copie del codice della stessa lunghezza:
//   nc = senza commenti (stringhe intatte)
//   ms = senza commenti e con il contenuto delle stringhe sostituito da spazi
function scan(code) {
  let nc = "", ms = "";
  const n = code.length;
  let i = 0;
  const blank = s => s.replace(/[^\n]/g, " ");
  while (i < n) {
    const c = code[i], d = code[i + 1];
    if (c === "/" && d === "/") {
      let j = code.indexOf("\n", i); if (j < 0) j = n;
      const sp = blank(code.slice(i, j)); nc += sp; ms += sp; i = j; continue;
    }
    if (c === "/" && d === "*") {
      let j = code.indexOf("*/", i + 2); j = j < 0 ? n : j + 2;
      const sp = blank(code.slice(i, j)); nc += sp; ms += sp; i = j; continue;
    }
    let pre = 0;
    if (c === '"') pre = 0;
    else if ((c === "$" || c === "@") && d === '"') pre = 1;
    else if ((c === "$" && d === "@" || c === "@" && d === "$") && code[i + 2] === '"') pre = 2;
    else pre = -1;
    if (pre >= 0) {
      const q = i + pre;
      const verbatim = code.slice(i, q).includes("@");
      let j = q + 1, closed = false;
      while (j < n) {
        if (!verbatim && code[j] === "\\") { j += 2; continue; }
        if (code[j] === '"') {
          if (verbatim && code[j + 1] === '"') { j += 2; continue; }
          closed = true; break;
        }
        if (code[j] === "\n" && !verbatim) break;
        j++;
      }
      j = Math.min(j, n);
      const head = code.slice(i, q + 1);
      const inner = code.slice(q + 1, j);
      const tail = closed ? '"' : "";
      nc += head + inner + tail;
      ms += head + blank(inner) + tail;
      i = j + (closed ? 1 : 0);
      continue;
    }
    if (c === "'") {
      const j = code.indexOf("'", i + (d === "\\" ? 3 : 2));
      if (j > 0 && j - i <= 4) {
        const s = code.slice(i, j + 1);
        nc += s; ms += "'" + " ".repeat(s.length - 2) + "'"; i = j + 1; continue;
      }
    }
    nc += c; ms += c; i++;
  }
  return { nc, ms };
}

// Corpo di un metodo o costruttore (dalla firma alla graffa chiusa), cercato per nome.
function bodyOf(sc, name) {
  const re = new RegExp("\\b" + name + "\\s*\\([^)]*\\)\\s*(?::\\s*base\\s*\\([^)]*\\)\\s*)?(\\{|=>)", "g");
  let m;
  while ((m = re.exec(sc.ms))) {
    // salta le chiamate tipo  x.Nome() {  (non esistono, ma non si sa mai) e le dichiarazioni dentro stringhe
    const start = m.index;
    let i = m.index + m[0].length;
    if (m[1] === "=>") {
      let depth = 0;
      while (i < sc.ms.length) {
        const ch = sc.ms[i];
        if (ch === "(" || ch === "{") depth++;
        else if (ch === ")" || ch === "}") depth--;
        else if (ch === ";" && depth <= 0) { i++; break; }
        i++;
      }
      return sc.nc.slice(start, i);
    }
    let depth = 1;
    while (i < sc.ms.length && depth) {
      const ch = sc.ms[i];
      if (ch === "{") depth++; else if (ch === "}") depth--;
      i++;
    }
    return sc.nc.slice(start, i);
  }
  return null;
}

// Numero in forma "tollerante": 0.20 accetta 0.2, 0.20, .2; 5 accetta 5, 5.0, 5.00
function numRe(n) {
  const [ip, fpRaw = ""] = String(n).split(".");
  const fp = fpRaw.replace(/0+$/, "");
  let core;
  if (ip === "0" && fp) core = "0?\\." + fp + "0*";
  else if (fp) core = ip + "\\." + fp + "0*";
  else core = ip + "(?:\\.0*)?";
  return "(?<![\\w.])" + core + "[dD]?(?![\\w.])";
}
function mulRe(a, n) {
  const N = numRe(n);
  return "(?:\\b" + a + "\\s*\\*\\s*" + N + "|" + N + "\\s*\\*\\s*" + a + "\\b)";
}

function ctxOf(code) {
  const sc = scan(code);
  const cache = {};
  return {
    code, nc: sc.nc, ms: sc.ms,
    body(name) { if (!(name in cache)) cache[name] = bodyOf(sc, name); return cache[name]; }
  };
}

const M = (re, fl) => ctx => new RegExp(re, fl || "").test(ctx.ms);
const S = (re, fl) => ctx => new RegExp(re, fl || "").test(ctx.nc);
const inBody = (name, re, fl) => ctx => { const b = ctx.body(name); return !!b && new RegExp(re, fl || "").test(scan(b).ms); };
const inBodyS = (name, re, fl) => ctx => { const b = ctx.body(name); return !!b && new RegExp(re, fl || "").test(b); };
const notInBody = (name, re) => ctx => { const b = ctx.body(name); return !!b && !new RegExp(re).test(scan(b).ms); };
const any = (...fs) => ctx => fs.some(f => f(ctx));
const all = (...fs) => ctx => fs.every(f => f(ctx));
const not = f => ctx => !f(ctx);

/* ---------- controlli validi per qualsiasi file ---------- */
const JAVAISMS = [
  [/\bextends\b/, "extends è Java. In C# l'ereditarietà si scrive con i due punti: class Libro : Risorsa"],
  [/\bimplements\b/, "implements è Java. In C# anche le interfacce vanno dopo i due punti."],
  [/\bsuper\s*[.(]/, "super è Java. In C# si scrive base: base(...) nel costruttore, base.Metodo() nei metodi."],
  [/System\.out\./, "System.out.println è Java. In C#: Console.WriteLine(...)"],
  [/@Override/, "@Override è Java. In C# la parola override fa parte della firma: public override string StampaDettagli()"],
  [/\bboolean\b/, "boolean è Java. In C# il tipo si chiama bool."],
  [/\.size\s*\(\s*\)/, ".size() è Java. In C# una lista ha la proprietà Count, senza parentesi."],
  [/\.length\s*\(\s*\)/, ".length() è Java. In C# una stringa ha la proprietà Length, senza parentesi."],
  [/\bArrayList\s*</, "ArrayList<T> è Java. In C# si usa List<T> (o BindingList<T> per la griglia)."],
  [/\bfor\s*\(\s*\w+\s+\w+\s*:\s*\w+/, "for (T x : lista) è il for-each di Java. In C#: foreach (T x in lista)"],
  [/Integer\.parseInt/, "Integer.parseInt è Java. In C#: Convert.ToInt32(...) oppure int.Parse(...)"],
  [/Double\.parseDouble/, "Double.parseDouble è Java. In C#: Convert.ToDouble(...)"],
  [/\bnew\s+Scanner\b/, "Scanner è Java. In C# leggi una riga con Console.ReadLine()"],
  [/^\s*import\s+[\w.]+\s*;/m, "import è Java. In C# si scrive using NomeNamespace;"],
  [/^\s*package\s+[\w.]+\s*;/m, "package è Java. In C# si usa namespace."],
  [/\bfinal\s+\w+/, "final è Java. In C# per le costanti si usa const (qui non serve)."],
];

function genericChecks(ctx) {
  const out = [];
  const ms = ctx.ms;
  const cnt = ch => (ms.match(new RegExp("\\" + ch, "g")) || []).length;
  const ob = cnt("{"), cb = cnt("}");
  if (ob !== cb) out.push({ ok: false, t: ob > cb ? `Mancano ${ob - cb} graffe chiuse }` : `Ci sono ${cb - ob} graffe chiuse } di troppo`, hint: ob > cb ? "Il compilatore lo segnala come CS1513: } expected." : "Probabilmente hai chiuso la classe o un metodo troppo presto." });
  const op = cnt("("), cp = cnt(")");
  if (op !== cp) out.push({ ok: false, t: "Parentesi tonde non bilanciate", hint: `Aperte ${op}, chiuse ${cp}. Controlla le chiamate tipo Convert.ToInt32(textBox.Text)` });
  for (const [re, msg] of JAVAISMS) if (re.test(ms)) out.push({ ok: false, t: "Sintassi Java", hint: msg });
  const self = ms.match(/^\s*(?:this\.)?(\w+)\s*=\s*\1\s*;/m);
  if (self) out.push({ ok: false, t: `Assegni ${self[1]} a se stesso`, hint: `CS1717: "${self[1]} = ${self[1]};" non fa nulla. Nel costruttore la proprietà ha la maiuscola: Codice = codice;` });
  if (/\bpublic\s+abstract\s+\w+\s+\w+\s*\([^)]*\)\s*\{/.test(ms)) out.push({ ok: false, t: "Metodo abstract con un corpo", hint: "Un metodo abstract non ha corpo. Qui ti serve virtual: public virtual string StampaDettagli() { ... }" });
  if (/\bconsole\.|\bconvert\.|\bmessagebox\./.test(ms)) out.push({ ok: false, t: "Maiuscole sbagliate", hint: "C# distingue maiuscole e minuscole: Console, Convert, MessageBox." });
  if (/Console\.(Writeline|writeLine|readLine|Readline)\b/.test(ms)) out.push({ ok: false, t: "Nome del metodo scritto male", hint: "Si scrive Console.WriteLine e Console.ReadLine, con la L maiuscola." });
  return out;
}

/* ---------- controlli costruiti dalla traccia ---------- */
function propTypeRe(ty) { return ty === "string" ? "string\\??" : ty; }

function baseChecks(SP, lib) {
  const B = SP.base;
  const L = [];
  L.push({ t: `Esiste la classe ${B.name}`, ok: M(`\\bclass\\s+${B.name}\\b`), hint: `public abstract class ${B.name} { ... }` });
  if (lib) L.push({ t: `${B.name} è public`, ok: M(`\\bpublic\\s+(?:abstract\\s+)?class\\s+${B.name}\\b`), hint: `Sta in una libreria: senza public il progetto della form non la vede (CS0122).` });
  L.push({ lvl: "w", t: `${B.name} è abstract`, ok: M(`\\babstract\\s+class\\s+${B.name}\\b`), hint: `La traccia accetta anche una classe normale. Con abstract nessuno può fare new ${B.name}(...).` });
  for (const [n, ty] of B.props) L.push({ t: `Proprietà ${n} di tipo ${ty}`, ok: M(`\\bpublic\\s+${propTypeRe(ty)}\\s+${n}\\s*\\{\\s*get`), hint: `public ${ty} ${n} { get; set; }` });
  const sig = B.props.map(([, ty]) => `\\s*${propTypeRe(ty)}\\s+\\w+\\s*`).join(",");
  L.push({ t: "Costruttore con un parametro per ogni proprietà", ok: M(`\\bpublic\\s+${B.name}\\s*\\(${sig}\\)`), hint: `public ${B.name}(${B.props.map(([n, ty]) => ty + " " + n[0].toLowerCase() + n.slice(1)).join(", ")})` });
  for (const [n] of B.props) L.push({ t: `Il costruttore assegna ${n}`, ok: inBody(B.name, `\\b(?:this\\.)?${n}\\s*=\\s*\\w+\\s*;`), hint: `${n} = ${n[0].toLowerCase() + n.slice(1)};` });
  L.push({ t: `${B.det}() è public virtual string`, ok: M(`\\bpublic\\s+virtual\\s+string\\s+${B.det}\\s*\\(\\s*\\)`), hint: `Le derivate devono chiamare la versione base, quindi virtual con il corpo: public virtual string ${B.det}()` });
  L.push({ t: `${B.det}() restituisce la stringa (niente Console)`, ok: all(inBody(B.det, `\\breturn\\b|=>`), notInBody(B.det, `Console\\.Write`)), hint: `La traccia dice "restituisce": return $"Codice: {Codice} | ...";` });
  L.push({ t: `${B.det}() mostra tutte le proprietà`, ok: ctx => { const b = ctx.body(B.det); return !!b && B.props.every(([n]) => new RegExp("\\b" + n + "\\b").test(b)); }, hint: B.props.map(([n]) => `{${n}}`).join(" ") });
  L.push({ t: `${B.calc}() è public virtual double`, ok: M(`\\bpublic\\s+virtual\\s+double\\s+${B.calc}\\s*\\(\\s*\\)`), hint: `public virtual double ${B.calc}()` });
  L.push({ t: `Formula base: ${B.rate[0]} × ${B.rate[1]}`, ok: inBody(B.calc, mulRe(B.rate[0], B.rate[1])), hint: `return ${B.rate[0]} * ${B.rate[1]};` });
  return L;
}

function derivedChecks(SP, i, lib) {
  const B = SP.base, D = SP.d[i];
  const [pn, pt] = D.prop;
  const L = [];
  L.push({ t: `${D.name} eredita da ${B.name}`, ok: M(`\\bclass\\s+${D.name}\\s*:\\s*${B.name}\\b`), hint: `public class ${D.name} : ${B.name}` });
  if (lib) L.push({ t: `${D.name} è public`, ok: M(`\\bpublic\\s+class\\s+${D.name}\\b`), hint: "Sta in una libreria: serve public." });
  L.push({ t: `Proprietà ${pn} di tipo ${pt}`, ok: M(`\\bpublic\\s+${pt}\\s+${pn}\\s*\\{\\s*get`), hint: `public ${pt} ${pn} { get; set; }` });
  const sig = B.props.map(([, ty]) => `\\s*${propTypeRe(ty)}\\s+\\w+\\s*`).join(",") + `,\\s*${pt}\\s+\\w+\\s*`;
  L.push({ t: "Costruttore con i parametri della base più quello nuovo", ok: M(`\\bpublic\\s+${D.name}\\s*\\(${sig}\\)`), hint: `public ${D.name}(${B.props.map(([n, ty]) => ty + " " + n[0].toLowerCase() + n.slice(1)).join(", ")}, ${pt} ${pn[0].toLowerCase() + pn.slice(1)})` });
  L.push({ t: `Il costruttore passa ${B.props.length} valori a base(...)`, ok: M(`\\)\\s*:\\s*base\\s*\\(\\s*\\w+\\s*(?:,\\s*\\w+\\s*){${B.props.length - 1}}\\)`), hint: `Dopo la firma: : base(${B.props.map(([n]) => n[0].toLowerCase() + n.slice(1)).join(", ")}). Senza, CS7036.` });
  L.push({ t: `Il costruttore assegna ${pn}`, ok: inBody(D.name, `\\b(?:this\\.)?${pn}\\s*=\\s*\\w+\\s*;`), hint: `${pn} = ${pn[0].toLowerCase() + pn.slice(1)};` });
  L.push({ t: `${B.det}() è public override string`, ok: M(`\\bpublic\\s+override\\s+string\\s+${B.det}\\s*\\(\\s*\\)`), hint: `public override string ${B.det}()` });
  L.push({ t: `${B.det}() chiama base.${B.det}()`, ok: inBody(B.det, `\\bbase\\s*\\.\\s*${B.det}\\s*\\(\\s*\\)`), hint: `"Chiama il metodo della classe base": base.${B.det}() + $" | ...: {${pn}}"` });
  L.push({ t: `${B.det}() aggiunge ${pn}`, ok: inBodyS(B.det, `\\b${pn}\\b`), hint: `Interpolazione: $" | ${pn}: {${pn}}"` });
  L.push({ t: `${B.calc}() è public override double`, ok: M(`\\bpublic\\s+override\\s+double\\s+${B.calc}\\s*\\(\\s*\\)`), hint: `public override double ${B.calc}()` });
  if (D.plus) {
    const N = numRe(D.plus);
    const bc = `base\\s*\\.\\s*${B.calc}\\s*\\(\\s*\\)`;
    L.push({ t: `Formula: base.${B.calc}() + ${D.plus}`, ok: inBody(B.calc, `${bc}\\s*\\+\\s*${N}|${N}\\s*\\+\\s*${bc}`), hint: `return base.${B.calc}() + ${D.plus};` });
  } else {
    for (const [a, n] of D.terms) L.push({ t: `Formula: contiene ${a} × ${n}`, ok: inBody(B.calc, mulRe(a, n)), hint: `return ${D.terms.map(([x, y]) => x + " * " + y).join(" + ")};` });
    L.push({ t: `${B.calc}() non usa base`, ok: notInBody(B.calc, `\\bbase\\s*\\.`), hint: `"invece di" vuol dire che la tariffa base va sostituita: se sommi base.${B.calc}() la conti due volte.` });
  }
  return L;
}

function switchBody(ms) {
  const m = /\bswitch\s*\([^)]*\)\s*\{/.exec(ms);
  if (!m) return null;
  let i = m.index + m[0].length, depth = 1;
  const s = i;
  while (i < ms.length && depth) { if (ms[i] === "{") depth++; else if (ms[i] === "}") depth--; i++; }
  return ms.slice(s, i - 1);
}
function switchFallthrough(ms) {
  const b = switchBody(ms); if (!b) return [];
  const parts = b.split(/\b(?=case\b|default\s*:)/).filter(p => /^(case|default)/.test(p.trim()));
  const bad = [];
  parts.slice(0, -1).forEach(p => {
    const stmts = p.replace(/^\s*(case\s+[^:]+|default)\s*:/, "");
    if (/;/.test(stmts) && !/\b(break|return|continue|throw)\b/.test(stmts)) bad.push(p.trim().split(/\s*:/)[0]);
  });
  return bad;
}
function switchDuplicates(ms) {
  const b = switchBody(ms); if (!b) return [];
  const seen = {}, dup = [];
  // conta solo le dichiarazioni al primo livello dello switch (non dentro { } dei singoli case)
  let depth = 0, flat = "";
  for (const ch of b) { if (ch === "{") depth++; if (depth === 0) flat += ch; if (ch === "}") depth--; }
  const re = /\b(?:string|int|double|bool|var)\s+(\w+)\s*=/g; let m;
  while ((m = re.exec(flat))) { if (seen[m[1]]) dup.push(m[1]); seen[m[1]] = 1; }
  return dup;
}

function runChecks(code, list) {
  const ctx = ctxOf(code);
  const res = list.map(c => {
    let ok = false;
    try { ok = !!c.ok(ctx); } catch (e) { ok = false; }
    return { t: c.t, hint: c.hint, lvl: c.lvl || "e", ok };
  });
  const gen = genericChecks(ctx).map(g => ({ ...g, lvl: "e", gen: true }));
  const all = gen.concat(res);
  const pass = all.every(r => r.ok || r.lvl === "w");
  return { list: all, pass, okCount: res.filter(r => r.ok).length, total: res.length };
}

// Estrae un metodo intero (firma compresa) da un file sorgente
function extractMethod(src, name) {
  const sc = scan(src);
  const re = new RegExp("^[ \\t]*(?:public|private|protected)[^\\n;{]*\\b" + name + "\\s*\\(", "m");
  const m = re.exec(sc.ms);
  if (!m) return "";
  let i = sc.ms.indexOf("{", m.index), depth = 0;
  for (; i < sc.ms.length; i++) { if (sc.ms[i] === "{") depth++; else if (sc.ms[i] === "}") { depth--; if (!depth) { i++; break; } } }
  // includi i commenti subito sopra la firma
  let s = m.index;
  const before = src.slice(0, s).split("\n");
  before.pop();
  while (before.length && /^\s*\/\//.test(before[before.length - 1])) { s -= before.pop().length + 1; }
  return dedent(src.slice(s, i));
}
function dedent(t) {
  const lines = t.replace(/^\n+/, "").split("\n");
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(ind)).join("\n").trimEnd();
}

    draft(id, v) { if (v === undefined) return data.drafts[id]; data.drafts[id] = v; save(); },
    seen(id) { data.seen[id] = 1; save(); },
    isSeen: id => !!data.seen[id],
    hint(id, v) { if (v === undefined) return data.hints[id] || 0; data.hints[id] = v; save(); },
    reset() { data = { done: {}, drafts: {}, seen: {}, hints: {} }; try { localStorage.removeItem(STORE_KEY); } catch (e) { } updateProgress(); },
  };
})();

/* ---------- evidenziazione con i colori di Visual Studio ---------- */
const KW = new Set("abstract as base bool break case catch char class const continue decimal default do double else enum false finally float for foreach get if in int interface internal is long namespace new null object out override partial private protected public readonly return sealed set static string struct switch this throw true try using value var virtual void while".split(" "));
const TY = new Set("Risorsa Libro Audiolibro Catalogo List BindingList Console Convert Math MessageBox Form EventArgs DataGridViewCellEventArgs DataGridView Exception FormatException NullReferenceException ArgumentOutOfRangeException Veicolo Auto Camion Flotta Abbonamento AbbonamentoSala AbbonamentoCorsi Palestra Prodotto Smartphone Televisore Magazzino FormCatalogo FormPalestra FormMagazzino Program Application String Int32 Double ApplicationConfiguration TextBox Button Label RadioButton IContainer Container Size Point AutoScaleMode DockStyle Enumerable Scanner ArrayList Integer System".split(" "));
function hl(src) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(\$?@?"(?:\\.|[^"\\\n])*"?)|('(?:\\.|[^'\\\n])')|(\b\d+(?:\.\d+)?[fFdDmM]?\b)|(@?[A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const [t] = m;
    if (m[1]) out += `<span class="c">${esc(t)}</span>`;
    else if (m[2] || m[3]) out += `<span class="s">${esc(t)}</span>`;
    else if (m[4]) out += `<span class="nu">${esc(t)}</span>`;
    else if (KW.has(t)) out += `<span class="k">${t}</span>`;
    else if (TY.has(t)) out += `<span class="ty">${t}</span>`;
    else out += esc(t);
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const code = (src, cls = "") => `<pre class="code ${cls}"><code>${hl(src.replace(/^\n/, ""))}</code></pre>`;

}

// Completa il codice: [[risposta|alternativa]] nel testo diventa una casella
function renderFill(el, X) {
  const parts = X.code.replace(/^\n/, "").split(/\[\[(.+?)\]\]/);
  let html = "";
  const answers = [];
  parts.forEach((p, i) => {
    if (i % 2 === 0) html += hl(p);
    else {
      const alts = p.split("|");
      answers.push(alts);
      const w = Math.max(...alts.map(a => a.length)) + 1;
      html += `<input class="blank" data-i="${answers.length - 1}" style="width:${w + 1}ch" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="spazio da completare ${answers.length}">`;
    }
  });
  el.innerHTML = exHead(X.id, X.title, "Completa") + (X.q ? `<p class="q">${X.q}</p>` : "") +
    `<pre class="code"><code>${html}</code></pre>
     <div class="row"><button class="btn primary" data-act="check">Controlla</button><button class="btn ghost" data-act="show">Mostra le risposte</button></div>
     <div class="fb" aria-live="polite"></div>`;
  const inputs = $$("input.blank", el);
  const saved = store.draft(X.id);
  if (Array.isArray(saved)) inputs.forEach((inp, i) => inp.value = saved[i] || "");
  const norm = s => s.replace(/\s+/g, " ").replace(/\s*([(),.;<>=+*{}\[\]])\s*/g, "$1").trim();
  const check = () => {
    let good = 0;
    inputs.forEach((inp, i) => {
      const v = norm(inp.value);
      const right = answers[i].some(a => norm(a) === v);
      inp.classList.toggle("ok", right); inp.classList.toggle("bad", !right && v !== "");
      if (right) good++;
    });
    store.draft(X.id, inputs.map(i => i.value));
    const fb = $(".fb", el);
    if (good === inputs.length) { fb.innerHTML = ok("Tutto giusto.") + (X.after ? `<div>${X.after}</div>` : ""); markDone(X.id); }
    else fb.innerHTML = `<span>${good} di ${inputs.length} giuste. Le caselle rosse sono da rivedere; quelle vuote restano viola.</span>` + (X.tips ? `<div>${X.tips}</div>` : "");
  };
  inputs.forEach((inp, i) => {
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); if (i < inputs.length - 1) inputs[i + 1].focus(); else check(); }
    });
    inp.addEventListener("input", () => { inp.classList.remove("ok", "bad"); });
  });
  $('[data-act="check"]', el).onclick = check;
  $('[data-act="show"]', el).onclick = () => {
    inputs.forEach((inp, i) => { inp.value = answers[i][0]; inp.classList.remove("bad"); inp.classList.add("ok"); });
    $(".fb", el).innerHTML = `<span>Ecco le risposte. Per segnarlo come superato, svuota le caselle e riscrivile a memoria.</span>`;
    store.draft(X.id, []);
  };
}

// markdown minimo: titoli, elenchi, codice, grassetto, codice in linea
function md(t) {
  const blocks = String(t).split(/```(?:csharp|cs|c#)?\n?([\s\S]*?)```/g);
  return blocks.map((b, i) => {
    if (i % 2) return code(b.replace(/\n$/, ""));
    const lines = b.split("\n"); let html = "", list = null;
    const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    const flush = () => { if (list) { html += `<${list.t}>${list.items.map(x => `<li>${inline(x)}</li>`).join("")}</${list.t}>`; list = null; } };
    for (const l of lines) {
      let m;
      if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (!list || list.t !== "ul") { flush(); list = { t: "ul", items: [] }; } list.items.push(m[1]); continue; }
      if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (!list || list.t !== "ol") { flush(); list = { t: "ol", items: [] }; } list.items.push(m[1]); continue; }
      flush();
      if ((m = l.match(/^#{1,4}\s+(.*)/))) html += `<h4>${inline(m[1])}</h4>`;
      else if (l.trim()) html += `<p>${inline(l)}</p>`;
    }
    flush(); return html;
  }).join("");
}

const modExCache = {};
function modExercises(m) {
  if (!modExCache[m.id]) modExCache[m.id] = exIdsIn(m.html()).concat(m.extraEx ? m.extraEx() : []);
  return modExCache[m.id];
}
function drawTree() {
  let html = "", grp = "";
  MODS.forEach((m, i) => {
    if (m.group !== grp) { grp = m.group; html += `<li class="grp">${grp}</li>`; }
    const ids = modExercises(m), d = ids.filter(id => store.isDone(id)).length;
    html += `<li><button data-go="${m.id}" ${m.id === currentMod ? 'aria-current="page"' : ""}><span class="n">${m.n ?? ""}</span><span>${m.title}</span><span class="p ${ids.length && d === ids.length ? "full" : ""}">${ids.length ? d + "/" + ids.length : ""}</span></button></li>`;
  });
  $("#tree").innerHTML = html;
  $$("#tree [data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; closeSide(); });
}
function updateProgress() {
  const all = Object.keys(EX);
  const d = all.filter(id => store.isDone(id)).length;
  $("#stCount").textContent = `${d} di ${all.length} esercizi`;
  $("#stBar").style.width = (all.length ? (d / all.length) * 100 : 0) + "%";
  $("#sideCount").textContent = `Hai superato ${d} esercizi su ${all.length}.`;
  drawTree();
}
function route() {
  const id = (location.hash || "").replace(/^#/, "") || "home";
  const m = MODS.find(x => x.id === id) || MODS[0];
  if (currentMod === m.id && $("#page").childElementCount) return;
  currentMod = m.id;
  const i = MODS.indexOf(m);
  const prev = MODS[i - 1], next = MODS[i + 1];
  $("#page").innerHTML = `<header class="mod-head">${m.n ? `<span class="kicker">Modulo ${m.n}</span>` : ""}<h1>${m.h1 || m.title}</h1>${m.lead ? `<p class="lead">${m.lead}</p>` : ""}</header>` + m.html() +
    `<nav class="pager">${prev ? `<a class="btn" href="#${prev.id}">Indietro: ${prev.title}</a>` : "<span></span>"}${next ? `<a class="btn primary" href="#${next.id}">Avanti: ${next.title}</a>` : ""}</nav>`;
  mountExercises($("#page"));
  if (m.after) m.after($("#page"));
  $("#stMod").textContent = m.n ? `Modulo ${m.n}: ${m.title}` : m.title;
  document.title = "Laboratorio C# Biblioteca";
  drawTree();
  window.scrollTo(0, 0);
  $("#page h1")?.setAttribute("tabindex", "-1");
}
function closeSide() { $("#side").dataset.open = 0; $("#openSide").setAttribute("aria-expanded", "false"); $("#scrim").dataset.open = $("#drawer").dataset.open === "1" ? 1 : 0; }

}

  const win = $("#win", host);
  const tb = n => $(`[data-tb="${n}"]`, host);
  const mission = id => { markDone(id); const m = $(`[data-m="${id}"]`, host); if (m) { m.classList.add("y"); $(".i", m).textContent = "✓"; } };
  const anyToggle = () => Object.values(S.t).some(Boolean);

  // ----- Output e codice -----
  const out = $("#out", host);
  const log = (cls, txt) => { S.log.push([cls, txt]); if (S.log.length > 160) S.log.splice(0, 40); drawLog(); };
  const drawLog = () => { out.innerHTML = S.log.map(([c, t]) => `<div class="${c}">${esc(t)}</div>`).join("") || `<div class="no">// premi un pulsante della form</div>`; out.scrollTop = out.scrollHeight; };
  const src = () => SOL["bib/FormCatalogo.cs"];
  function handlerCode(name) {
    let c = name === "FormCatalogo" ? extractMethod(src(), "FormCatalogo") : extractMethod(src(), name);
    if (name === "dataGridViewRisorse_CellClick" && S.t.guard) c = c.replace(/\n\s*if \(e\.RowIndex < 0\) return;\n/, "\n    // controllo e.RowIndex < 0 tolto\n");
    if (name === "buttonModifica_Click" && S.t.nullc) c = c.replace(/\n\s*if \(r == null\)\s*\{[\s\S]*?return;\s*\}\n/, "\n    // controllo r == null tolto\n");
    if (name === "buttonModifica_Click" && S.t.refresh) c = c.replace(/\n\s*dataGridViewRisorse\.Refresh\(\);/, "\n    // Refresh() tolto");
    if (name === "buttonCarica_Click" && S.t.list) c = c.replace("{", "{\n    // qui catalogo.Risorse è una List<Risorsa>, non una BindingList");
    return c;
  }
  const showCode = name => { S.handler = name; $("#codeH", host).textContent = "FormCatalogo.cs: " + name; $("#codeP", host).innerHTML = code(handlerCode(name)); };

  // ----- memoria e griglia -----
  const drawMem = () => {
    $("#mem", host).innerHTML = S.list.length ? S.list.map((r, i) => `<div class="st">[${i}] ${esc(r.tipo)} { Codice = "${esc(r.Codice)}", Titolo = "${esc(r.Titolo)}", GiorniPrestito = ${r.GiorniPrestito}, ${r.tipo === "Libro" ? "NumeroPagine = " + r.NumeroPagine : "DurataMinuti = " + r.DurataMinuti} }</div>`).join("") : `<div class="no">// lista vuota</div>`;
  };
  const snap = () => S.list.map(r => [r.Codice, r.Titolo, r.Autore, r.GiorniPrestito]);
  const reread = () => { // Refresh(): rilegge i valori delle righe che la griglia conosce
    S.shown = S.shown.map((_, i) => S.list[i] ? [S.list[i].Codice, S.list[i].Titolo, S.list[i].Autore, S.list[i].GiorniPrestito] : S.shown[i]);
  };
  const drawGrid = () => {
    const g = $("#grid", host);
    if (!S.bound) { g.innerHTML = `<div class="emptygrid"></div>`; return; }
    const cols = ["Codice", "Titolo", "Autore", "GiorniPrestito"];
    g.innerHTML = `<table><thead><tr><th class="rh"></th>${cols.map((c, j) => `<th data-r="-1" data-c="${j}">${c}</th>`).join("")}</tr></thead>
      <tbody>${S.shown.map((row, i) => `<tr class="${i === S.sel ? "sel" : ""}"><td class="rh" data-r="${i}" data-c="-1"></td>${row.map((v, j) => `<td data-r="${i}" data-c="${j}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    $$("[data-r]", g).forEach(c => c.onclick = () => cellClick(+c.dataset.r, +c.dataset.c));
  };
  const listChanged = () => { // BindingList: la griglia si ridisegna da sola
    if (!S.bound) return;
    if (S.t.list) { log("no", "// List<T> non manda ListChanged: la griglia non lo sa"); return; }
    S.shown = snap();
    log("no", "BindingList.ListChanged → la DataGridView si ridisegna");
  };
  const redraw = () => { drawGrid(); drawMem(); };

  // ----- dialoghi -----
  function msgBox(text, caption = "") {
    showDlg(`<div class="wdlg" role="dialog" aria-modal="true" aria-label="MessageBox"><div class="dt"><span>${esc(caption)}</span><span>✕</span></div><div class="db">${esc(text)}</div><div class="df"><button class="wbtn" data-ok>OK</button></div></div>`);
  }
  function exception(err, where) {
    log("ex", `Eccezione generata: '${err.type}' in BibliotecaWinForms.dll`);
    showDlg(`<div class="wdlg exc" role="alertdialog" aria-modal="true" aria-label="Eccezione non gestita"><div class="dt"><span>Visual Studio: eccezione non gestita</span><span>✕</span></div><div class="db"><b>${esc(err.type)}</b>'${esc(err.message)}'\n\nin FormCatalogo.${esc(where)}</div><div class="df"><button class="wbtn" data-ok>Continua</button></div></div>`);
    if (err.type === "System.FormatException") mission("sim-fmt");
    if (anyToggle() && err.type !== "System.FormatException") mission("sim-bug");
  }
  function showDlg(html) {
    const back = document.createElement("div");
    back.className = "wdlg-back"; back.innerHTML = html;
    win.appendChild(back);
    const okb = $("[data-ok]", back);
    const close = () => { back.remove(); document.removeEventListener("keydown", onKey, true); };
    const onKey = e => { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); e.stopPropagation(); close(); } };
    okb.onclick = close; document.addEventListener("keydown", onKey, true);
    setTimeout(() => okb.focus(), 20);
  }
  const run = (name, fn) => {
    log("ev", name + "(sender, e)");
    showCode(name);
    try { fn(); } catch (err) { if (err instanceof SimError) exception(err, name); else throw err; }
    redraw();
  };

  // ----- gestori: ricalcano FormCatalogo.cs -----
  const setRadio = v => {
    if (S.radio === v) return;
    S.radio = v; $$('input[name="tipoSim"]', host).forEach(r => r.checked = r.value === v);
    log("ev", "radioButtonLibro_CheckedChanged(sender, e)");
    $("#labelExtra", host).textContent = v === "Libro" ? "Numero pagine" : "Durata (minuti)";
    log("st", `labelExtra.Text = "${$("#labelExtra", host).textContent}"`);
  };
  const find = codice => { const r = S.list.find(x => x.Codice === codice) || null; log("st", `catalogo.CercaPerCodice("${codice}") → ${r ? r.tipo + " " + r.Codice : "null"}`); return r; };
  const conv = (box, label) => { const v = tb(box).value; const n = toInt32(v); log("st", `Convert.ToInt32(textBox${box}.Text) → ${n}`); return n; };

  function cellClick(row, col) {
    run("dataGridViewRisorse_CellClick", () => {
      log("st", `e.RowIndex = ${row}, e.ColumnIndex = ${col}`);
      if (row < 0 && !S.t.guard) { log("st", "if (e.RowIndex < 0) return;  → clic sull'intestazione, esco"); return; }
      S.sel = row;
      if (row < 0 || row >= S.list.length) { log("st", `catalogo.Risorse[${row}]`); throw OUT_OF_RANGE(); }
      const r = S.list[row];
      log("st", `Risorsa r = catalogo.Risorse[${row}] → ${r.tipo} ${r.Codice}`);
      tb("Codice").value = r.Codice; tb("Titolo").value = r.Titolo; tb("Autore").value = r.Autore; tb("Giorni").value = String(r.GiorniPrestito);
      log("st", "textBox....Text = r.Codice, r.Titolo, r.Autore, r.GiorniPrestito.ToString()");
      log("st", `r is Libro → ${r.tipo === "Libro"}`);
      setRadio(r.tipo);
      tb("Extra").value = String(r.tipo === "Libro" ? r.NumeroPagine : r.DurataMinuti);
      $("#labelDettagli", host).textContent = dettagli(r) + `\nPenale: ${fmtIt(penale(r))} €`;
      log("st", `labelDettagli.Text = r.StampaDettagli() + penale ${fmtIt(penale(r))} €`);
      mission("sim-click");
    });
  }
  const H = {
    Carica: () => run("buttonCarica_Click", () => {
      S.bound = true; S.shown = snap(); S.sel = -1;
      log("st", `dataGridViewRisorse.DataSource = catalogo.Risorse  (${S.list.length} elementi)`);
      log("no", "// colonne dalle proprietà public di Risorsa: Codice, Titolo, Autore, GiorniPrestito");
      mission("sim-carica");
    }),
    Inserisci: () => run("buttonInserisci_Click", () => {
      if (find(tb("Codice").value) != null) { log("st", 'MessageBox.Show("Codice già presente.")'); msgBox("Codice già presente."); return; }
      const giorni = conv("Giorni"), extra = conv("Extra");
      const r = { tipo: S.radio, Codice: tb("Codice").value, Titolo: tb("Titolo").value, Autore: tb("Autore").value, GiorniPrestito: giorni };
      if (S.radio === "Libro") r.NumeroPagine = extra; else r.DurataMinuti = extra;
      log("st", `radioButtonLibro.Checked → ${S.radio === "Libro"}: new ${S.radio}("${r.Codice}", ..., ${giorni}, ${extra})`);
      S.list.push(r);
      log("st", "catalogo.AggiungiRisorsa(r)");
      listChanged();
      if (S.radio === "Audiolibro") mission("sim-ins");
      if (S.t.list) mission("sim-bug");
    }),
    Modifica: () => run("buttonModifica_Click", () => {
      const r = find(tb("Codice").value);
      if (r == null) {
        if (!S.t.nullc) { log("st", 'MessageBox.Show("Risorsa non trovata.")'); msgBox("Risorsa non trovata."); return; }
        log("st", "r.Titolo = textBoxTitolo.Text  con r == null"); throw NULL_REF();
      }
      const old = r.GiorniPrestito;
      r.Titolo = tb("Titolo").value; r.Autore = tb("Autore").value;
      log("st", `r.Titolo = "${r.Titolo}"; r.Autore = "${r.Autore}";`);
      r.GiorniPrestito = conv("Giorni");
      const extra = conv("Extra");
      if (r.tipo === "Libro") r.NumeroPagine = extra; else r.DurataMinuti = extra;
      const giorni = r.GiorniPrestito;
      log("st", `r.GiorniPrestito = ${giorni}; ${r.tipo === "Libro" ? "l.NumeroPagine" : "a.DurataMinuti"} = ${extra};`);
      log("no", "// cambiare una proprietà non passa dalla BindingList: nessun ListChanged");
      if (S.t.refresh) { log("no", "// senza Refresh() la griglia mostra ancora i valori vecchi"); mission("sim-bug"); }
      else { reread(); log("st", "dataGridViewRisorse.Refresh()  → rilegge i valori"); }
      if (giorni !== old) mission("sim-mod");
    }),
    Cancella: () => run("buttonCancella_Click", () => {
      const r = find(tb("Codice").value);
      if (r != null) {
        S.list.splice(S.list.indexOf(r), 1);
        log("st", "catalogo.RimuoviRisorsa(r)");
        $("#labelDettagli", host).textContent = "";
        listChanged();
        if (!S.t.list) S.sel = -1;
        mission("sim-del");
      } else log("st", "r == null: non faccio niente");
    }),
    Visualizza: () => run("buttonVisualizza_Click", () => {
      log("st", "MessageBox.Show(catalogo.VisualizzaCatalogo(), \"Catalogo\")");
      msgBox(S.list.map(dettagli).join("\n") || "", "Catalogo");
    }),
    Penale: () => run("buttonPenale_Click", () => {
      const tot = S.list.reduce((a, r) => a + penale(r), 0);
      log("st", `catalogo.CalcolaPenaleTotale() → ${fmtIt(tot)}  (somma: ${S.list.map(r => fmtIt(penale(r))).join(" + ") || "0"})`);
      msgBox(`Penale totale: ${fmtIt(tot)} €`);
      mission("sim-pen");
    }),
    Chiudi: () => run("buttonChiudi_Click", () => { log("st", "Close()"); msgBox("Close() chiude la finestra e, visto che è la form principale, termina l'applicazione. Qui la lascio aperta per continuare.", "Chiudi"); }),
  };
  $$("[data-b]", host).forEach(b => b.onclick = () => H[b.dataset.b]());
  $$('input[name="tipoSim"]', host).forEach(r => r.onchange = () => { if (r.checked) { S.radio = r.value === "Libro" ? "Audiolibro" : "Libro"; setRadio(r.value); showCode("radioButtonLibro_CheckedChanged"); } });
  $$("[data-t]", host).forEach(c => c.onchange = () => {
    S.t[c.dataset.t] = c.checked;
    log("no", `// ${c.parentElement.textContent.trim()}: ${c.checked ? "attivo" : "tolto"}`);
    showCode(S.handler);
  });
  $('[data-act="reset"]', host).onclick = () => {
    S.list = seedCatalog(); S.bound = false; S.shown = []; S.sel = -1; S.log = [];
    $$("[data-tb]", host).forEach(i => i.value = ""); $("#labelDettagli", host).textContent = "";
    setRadio("Libro"); S.log = []; drawLog(); showCode("FormCatalogo"); redraw();
  };
  log("ev", "FormCatalogo()  costruttore");
  log("st", "InitializeComponent(); catalogo = new Catalogo(); catalogo.CaricaDatiDiProva();");
  showCode("FormCatalogo");
  redraw();
}

/* ============================================================
   Avvio
   ============================================================ */
(function boot() {
  $("#openSide").onclick = () => { const o = $("#side").dataset.open !== "1"; $("#side").dataset.open = o ? 1 : 0; $("#openSide").setAttribute("aria-expanded", String(o)); $("#scrim").dataset.open = o ? 1 : 0; };
  $("#scrim").onclick = () => { closeSide(); openDrawer(false); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$(".wdlg-back")) { closeSide(); openDrawer(false); } });
  $("#resetBtn").onclick = () => { $("#resetBtn").hidden = true; $("#resetConfirm").hidden = false; };
  $("#resetNo").onclick = () => { $("#resetBtn").hidden = false; $("#resetConfirm").hidden = true; };
  $("#resetYes").onclick = () => { store.reset(); $("#resetBtn").hidden = false; $("#resetConfirm").hidden = true; currentMod = null; route(); };
  $("#tutorBtn").onclick = () => openDrawer($("#drawer").dataset.open !== "1");
  $("#closeDrawer").onclick = () => openDrawer(false);
  $("#chatSend").onclick = sendChat;
  $("#chatStop").onclick = () => chatCtrl && chatCtrl.abort();
  $("#chatIn").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendChat(); } });
  whenSample(() => { $("#tutorBtn").hidden = false; $("#chatNote").textContent = "Ctrl+Invio per inviare"; });
  window.addEventListener("hashchange", route);
  updateProgress();
  route();
  initSample();
})();

</script>
</body></html>
