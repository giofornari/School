<text class="sotto" x="839" y="230">e lavanderia</text>
<text class="nome" x="1139" y="206">CAMERA</text>
<text class="nome" x="1139" y="232">MATRIMONIALE</text>

<text class="nome"  x="136" y="527">CORRIDOIO</text>
<text class="sotto" x="136" y="552">disimpegno · distribuzione verso tutti gli ambienti</text>

<text class="nome" x="136"  y="659">SOGGIORNO</text>
<text class="nome" x="639"  y="659">STUDIO</text>
<text class="nome" x="939"  y="659">CAMERA</text>
<text class="nome" x="939"  y="685">SINGOLA</text>
<text class="nome" x="1239" y="659">LOCALE</text>
<text class="nome" x="1239" y="685">TECNICO</text>
<text class="sotto" x="1239" y="708">rack · modem</text>

<text class="nome"  x="1586" y="206">GARAGE</text>
<text class="sotto" x="1586" y="230">accesso carrabile</text>

<text class="nome"  x="560" y="1040">GIARDINO — AREA ESTERNA</text>
<text class="sotto" x="560" y="1064">esposizione sud · pannello solare, sensore di luce, irrigazione, centralina MCU</text>

<!-- ============ AREE DI POSA (non sono locali: nessun muro) ============ -->
<g>
  <rect class="area" x="1540" y="470" width="570" height="190" rx="12"/>
  <text class="nome"  x="1566" y="510">CANTINA</text>
  <text class="sotto" x="1566" y="534">interrato · batteria di accumulo e contatore</text>

  <rect class="area" x="1540" y="700" width="570" height="260" rx="12"/>
  <text class="nome"  x="1566" y="740">RETE DELL'OPERATORE</text>
  <text class="sotto" x="1566" y="764">router ISP, nuvola di accesso (DSLAM), server pubblici</text>
