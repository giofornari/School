<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1300" viewBox="0 0 2200 1300"
     font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<!--
  SFONDO PER CISCO PACKET TRACER - Progetto CPT Domotica e IoT
  Villa su un piano con garage e giardino.

  Versione "casa piu' grande, ancora piu' spazio":
    - tela 2200x1300 invece di 1600x1000
    - nove ambienti grandi + garage + giardino
    - il locale tecnico e' una STANZA vera, non piu' un riquadro a lato
    - il soggiorno passa da 396x284 a 494x325 px di pavimento libero
    - il corridoio e' una fascia continua di 1378x120 px, senza un solo
      arco di porta che ci entri dentro
    - nessun arredo, nessun sanitario: pavimento completamente sgombro

  Convenzioni architettoniche:
    - muri a spessore pieno: perimetrali 16 px, divisori 9 px
    - vani porta = interruzione reale del muro + battente + arco
    - finestre = interruzione del muro con tre linee nello spessore
    - tutte le porte si aprono DENTRO le stanze, mai nel corridoio
-->
<defs>
  <style>
    .muro    { fill:#77828b }
    .vuoto   { fill:#ffffff }
    .pav     { fill:#ffffff }
    .pav-wet { fill:#f5fafc }
    .pav-tec { fill:#fbf8f2 }
    .pav-out { fill:#f2f8f1 }
    .arco    { fill:none; stroke:#d3dade; stroke-width:1.5 }
    .batt    { stroke:#b3bcc2; stroke-width:2.2 }
    .vetro   { stroke:#9aa4ac; stroke-width:1.5 }
    .ring    { fill:none; stroke:#cdd7cd; stroke-width:1.8 }
    .nome    { font-size:19px; font-weight:700; fill:#78838c; letter-spacing:2.6px }
    .sotto   { font-size:13px; fill:#aeb7bd; letter-spacing:.7px }
    .area    { fill:#fcfcfb; stroke:#c2cad0; stroke-width:2 }
    .ttl     { font-size:30px; font-weight:700; fill:#4d575f }
    .sub     { font-size:15px; fill:#9aa4ac }
  </style>
</defs>

<rect fill="#ffffff" x="0" y="0" width="2200" height="1300"/>

<text class="ttl" x="90" y="68">Progetto CPT — Domotica e IoT</text>
<text class="sub" x="90" y="97">Villa su un piano · pianta e aree di posa degli apparati</text>

<!-- ======================= PAVIMENTI VILLA ======================= -->
<rect class="pav"     x="106"  y="166" width="324" height="315"/><!-- ingresso -->
<rect class="pav"     x="439"  y="166" width="361" height="315"/><!-- cucina -->
<rect class="pav-wet" x="809"  y="166" width="291" height="315"/><!-- bagno -->
<rect class="pav"     x="1109" y="166" width="375" height="315"/><!-- camera matrimoniale -->
<rect class="pav"     x="106"  y="490" width="1378" height="120"/><!-- corridoio -->
<rect class="pav"     x="106"  y="619" width="494" height="325"/><!-- soggiorno -->
<rect class="pav"     x="609"  y="619" width="291" height="325"/><!-- studio -->
<rect class="pav"     x="909"  y="619" width="291" height="325"/><!-- camera singola -->
<rect class="pav-tec" x="1209" y="619" width="275" height="325"/><!-- locale tecnico -->

<!-- ======================= MURI VILLA ======================= -->
<!-- perimetrali, 16 px -->
<rect class="muro" x="90"   y="150" width="1410" height="16"/>
<rect class="muro" x="90"   y="944" width="1410" height="16"/>
<rect class="muro" x="90"   y="150" width="16"   height="810"/>
<rect class="muro" x="1484" y="150" width="16"   height="810"/>
<!-- divisori, 9 px -->
<rect class="muro" x="106"  y="481" width="1378" height="9"/>
<rect class="muro" x="106"  y="610" width="1378" height="9"/>
<rect class="muro" x="430"  y="166" width="9"    height="315"/>
<rect class="muro" x="800"  y="166" width="9"    height="315"/>
<rect class="muro" x="1100" y="166" width="9"    height="315"/>
<rect class="muro" x="600"  y="619" width="9"    height="325"/>
<rect class="muro" x="900"  y="619" width="9"    height="325"/>
<rect class="muro" x="1200" y="619" width="9"    height="325"/>

<!-- ======================= VANI PORTA ======================= -->
<g>
  <!-- porta d'ingresso, muro perimetrale sinistro -->
  <rect class="vuoto" x="90" y="250" width="16" height="110"/>
  <line class="batt" x1="106" y1="250" x2="216" y2="250"/>
  <path class="arco" d="M216 250 a110 110 0 0 1 -110 110"/>

  <!-- ingresso -> corridoio -->
  <rect class="vuoto" x="200" y="481" width="100" height="9"/>
  <line class="batt" x1="200" y1="481" x2="200" y2="381"/>
  <path class="arco" d="M200 381 a100 100 0 0 1 100 100"/>

  <!-- cucina -> corridoio -->
  <rect class="vuoto" x="560" y="481" width="100" height="9"/>
  <line class="batt" x1="660" y1="481" x2="660" y2="381"/>
  <path class="arco" d="M660 381 a100 100 0 0 0 -100 100"/>

  <!-- bagno -> corridoio -->
  <rect class="vuoto" x="900" y="481" width="90" height="9"/>
  <line class="batt" x1="900" y1="481" x2="900" y2="391"/>
  <path class="arco" d="M900 391 a90 90 0 0 1 90 90"/>

  <!-- camera matrimoniale -> corridoio -->
  <rect class="vuoto" x="1280" y="481" width="100" height="9"/>
  <line class="batt" x1="1380" y1="481" x2="1380" y2="381"/>
  <path class="arco" d="M1380 381 a100 100 0 0 0 -100 100"/>

  <!-- soggiorno -> corridoio: apertura ampia, open space -->
  <rect class="vuoto" x="250" y="610" width="250" height="9"/>

  <!-- studio -> corridoio -->
  <rect class="vuoto" x="700" y="610" width="90" height="9"/>
  <line class="batt" x1="790" y1="619" x2="790" y2="709"/>
  <path class="arco" d="M790 709 a90 90 0 0 0 -90 -90"/>

  <!-- camera singola -> corridoio -->
  <rect class="vuoto" x="1000" y="610" width="90" height="9"/>
  <line class="batt" x1="1090" y1="619" x2="1090" y2="709"/>
  <path class="arco" d="M1090 709 a90 90 0 0 0 -90 -90"/>

  <!-- locale tecnico -> corridoio -->
  <rect class="vuoto" x="1300" y="610" width="90" height="9"/>
  <line class="batt" x1="1390" y1="619" x2="1390" y2="709"/>
  <path class="arco" d="M1390 709 a90 90 0 0 0 -90 -90"/>

  <!-- porta-finestra scorrevole soggiorno -> giardino -->
  <rect class="vuoto" x="250" y="944" width="270" height="16"/>
  <line class="vetro" x1="250" y1="949" x2="392" y2="949"/>
  <line class="vetro" x1="378" y1="956" x2="520" y2="956"/>
</g>

<!-- ======================= FINESTRE ======================= -->
<g>
  <rect class="vuoto" x="160" y="150" width="140" height="16"/>
  <line class="vetro" x1="160" y1="154" x2="300" y2="154"/>
  <line class="vetro" x1="160" y1="158" x2="300" y2="158"/>
  <line class="vetro" x1="160" y1="162" x2="300" y2="162"/>

  <rect class="vuoto" x="500" y="150" width="220" height="16"/>
  <line class="vetro" x1="500" y1="154" x2="720" y2="154"/>
  <line class="vetro" x1="500" y1="158" x2="720" y2="158"/>
  <line class="vetro" x1="500" y1="162" x2="720" y2="162"/>

  <rect class="vuoto" x="880" y="150" width="150" height="16"/>
  <line class="vetro" x1="880" y1="154" x2="1030" y2="154"/>
  <line class="vetro" x1="880" y1="158" x2="1030" y2="158"/>
  <line class="vetro" x1="880" y1="162" x2="1030" y2="162"/>

  <rect class="vuoto" x="1180" y="150" width="240" height="16"/>
  <line class="vetro" x1="1180" y1="154" x2="1420" y2="154"/>
  <line class="vetro" x1="1180" y1="158" x2="1420" y2="158"/>
  <line class="vetro" x1="1180" y1="162" x2="1420" y2="162"/>

  <rect class="vuoto" x="90" y="700" width="16" height="170"/>
  <line class="vetro" x1="94"  y1="700" x2="94"  y2="870"/>
  <line class="vetro" x1="98"  y1="700" x2="98"  y2="870"/>
  <line class="vetro" x1="102" y1="700" x2="102" y2="870"/>

  <rect class="vuoto" x="1484" y="230" width="16" height="170"/>
  <line class="vetro" x1="1488" y1="230" x2="1488" y2="400"/>
  <line class="vetro" x1="1492" y1="230" x2="1492" y2="400"/>
  <line class="vetro" x1="1496" y1="230" x2="1496" y2="400"/>

  <rect class="vuoto" x="1484" y="700" width="16" height="150"/>
  <line class="vetro" x1="1488" y1="700" x2="1488" y2="850"/>
  <line class="vetro" x1="1492" y1="700" x2="1492" y2="850"/>
  <line class="vetro" x1="1496" y1="700" x2="1496" y2="850"/>

  <rect class="vuoto" x="660" y="944" width="180" height="16"/>
  <line class="vetro" x1="660" y1="948" x2="840" y2="948"/>
  <line class="vetro" x1="660" y1="952" x2="840" y2="952"/>
  <line class="vetro" x1="660" y1="956" x2="840" y2="956"/>

  <rect class="vuoto" x="960" y="944" width="180" height="16"/>
  <line class="vetro" x1="960" y1="948" x2="1140" y2="948"/>
  <line class="vetro" x1="960" y1="952" x2="1140" y2="952"/>
  <line class="vetro" x1="960" y1="956" x2="1140" y2="956"/>
</g>

<!-- ======================= GARAGE ======================= -->
<g>
  <rect class="pav" x="1556" y="166" width="538" height="248"/>
  <rect class="muro" x="1540" y="150" width="570" height="16"/>
  <rect class="muro" x="1540" y="414" width="570" height="16"/>
  <rect class="muro" x="1540" y="150" width="16"  height="280"/>
  <rect class="muro" x="2094" y="150" width="16"  height="280"/>
  <!-- basculante: interruzione del muro con lamelle -->
  <rect class="vuoto" x="1660" y="414" width="340" height="16"/>
  <g stroke="#9aa4ac" stroke-width="1.4">
    <line x1="1660" y1="418" x2="2000" y2="418"/>
    <line x1="1660" y1="422" x2="2000" y2="422"/>
    <line x1="1660" y1="426" x2="2000" y2="426"/>
  </g>
</g>

<!-- ======================= GIARDINO ======================= -->
<g>
  <rect class="pav-out" x="90" y="1000" width="2020" height="240"/>
  <rect class="ring"    x="90" y="1000" width="2020" height="240"/>
  <!-- vialetto accennato verso la porta-finestra -->
  <line class="ring" x1="330" y1="1000" x2="330" y2="1240"/>
  <line class="ring" x1="440" y1="1000" x2="440" y2="1240"/>
</g>

<!-- ======================= ETICHETTE ======================= -->
<text class="nome" x="136"  y="206">INGRESSO</text>
<text class="nome" x="469"  y="206">CUCINA</text>
