<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra Login Node</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@400;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Tabellone da sala giochi: fondo prugna notte a puntini (le lampadine spente),
   colori saturi solo per gli stati: verde giusto, rosso sbagliato, giallo XP, arancio tempo. */
:root {
    --fondo: #150a17;
    --pannello: #241027;
    --pannello-2: #2f1533;
    --bordo: #4a2352;
    --codice: #0c050e;
    --testo: #fff3fb;
    --tenue: #d3a9db;
    --verde: #1fe06a;
    --verde-ombra: #0c8a3c;
    --rosso: #ff2d55;
    --rosso-ombra: #a0102c;
    --giallo: #ffd400;
    --giallo-ombra: #a88a00;
    --arancio: #ff7b00;
    --arancio-ombra: #a84e00;
    --viola: #c45cff;
    --viola-ombra: #6f2499;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --corpo: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
    margin: 0;
    background: radial-gradient(circle, rgba(255, 243, 251, 0.05) 1.2px, transparent 1.6px) 0 0 / 14px 14px, var(--fondo);
    color: var(--testo);
    font-family: var(--corpo);
    font-size: 16px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
}
#app {
    max-width: 640px;
    margin: 0 auto;
    padding-block: 12px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 14px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
h1 { font-size: clamp(1.6rem, 7vw, 2.3rem); line-height: 1.05; }
h2 { font-size: 1.35rem; }
p { margin: 0; }
code, pre, .mono { font-family: var(--mono); }
/* niente legature: !== e => devono restare i caratteri che scrivi a mano */
code, pre, .mono, .riga, input.risposta, textarea.risposta { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--giallo); outline-offset: 2px; }

/* ---------- barra punteggi ---------- */
.barra {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--pannello);
    border: 2px solid var(--bordo);
    border-radius: 16px;
    font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fondo); }
.barra .vite { color: var(--rosso); font-size: 1.3rem; letter-spacing: 2px; white-space: nowrap; }
.barra .vite .persa { color: var(--bordo); }
.barra .xp { font-family: var(--display); color: var(--giallo); margin-left: auto; white-space: nowrap; }
.barra .combo { font-family: var(--display); color: var(--arancio); white-space: nowrap; }
.barra .combo[data-n="0"] { color: var(--bordo); }
.barra .esci { background: none; border: 0; color: var(--tenue); font-size: 0.9rem; cursor: pointer; padding: 4px; }

/* ---------- bottoni 3D ---------- */
.btn {
    --c: var(--verde); --o: var(--verde-ombra); --t: #062b13;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 10px 18px;
    background: var(--c); color: var(--t);
    border: 0; border-radius: 14px;
    box-shadow: 0 6px 0 var(--o);
    font-family: var(--display); font-size: 1rem; letter-spacing: 0.04em;
    cursor: pointer; transition: transform 0.06s, box-shadow 0.06s;
    margin-bottom: 6px;
    touch-action: manipulation;
}
.btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 var(--o); }
.btn:disabled { filter: saturate(0.2) brightness(0.6); cursor: not-allowed; }
.btn.largo { width: 100%; }
.btn.rosso { --c: var(--rosso); --o: var(--rosso-ombra); --t: #fff; }
.btn.giallo { --c: var(--giallo); --o: var(--giallo-ombra); --t: #2b2300; }
.btn.arancio { --c: var(--arancio); --o: var(--arancio-ombra); --t: #2b1400; }
.btn.viola { --c: var(--viola); --o: var(--viola-ombra); --t: #fff; }
.btn.scuro { --c: var(--pannello-2); --o: #12060f; --t: var(--testo); border: 2px solid var(--bordo); }

/* ---------- home ---------- */
.titolo { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.titolo .occhiello { font-family: var(--mono); color: var(--tenue); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; }
.titolo h1 span { color: var(--verde); }
.titolo p { color: var(--tenue); }
.mappa { display: flex; flex-direction: column; gap: 10px; }
.tappa {
    display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 10px 12px;
    background: var(--pannello); border: 2px solid var(--bordo); border-radius: 16px;
    box-shadow: 0 5px 0 #0b040c; cursor: pointer; margin-bottom: 5px;
}
.tappa:active:not(:disabled) { transform: translateY(5px); box-shadow: none; }
.tappa .num {
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--display); font-size: 1.3rem;
    background: var(--giallo); color: #2b2300; box-shadow: 0 4px 0 var(--giallo-ombra);
}
.tappa.fatta .num { background: var(--verde); color: #062b13; box-shadow: 0 4px 0 var(--verde-ombra); }
.tappa.boss .num { background: var(--rosso); color: #fff; box-shadow: 0 4px 0 var(--rosso-ombra); }
.tappa:disabled { cursor: not-allowed; opacity: 0.45; }
.tappa:disabled .num { background: var(--bordo); color: var(--tenue); box-shadow: none; }
.tappa .nome { font-weight: 800; display: block; }
.tappa .sotto { color: var(--tenue); font-size: 0.85rem; display: block; min-width: 0; }
.tappa .stato { font-family: var(--display); font-size: 0.8rem; color: var(--tenue); white-space: nowrap; }
.tappa.fatta .stato { color: var(--verde); }
.azioni { display: flex; flex-direction: column; gap: 8px; }
.azzera { background: none; border: 0; color: var(--tenue); text-decoration: underline; cursor: pointer; padding: 8px; align-self: center; font-size: 0.9rem; }

/* ---------- esercizio ---------- */
.progresso { height: 14px; background: var(--pannello); border: 2px solid var(--bordo); border-radius: 99px; overflow: hidden; }
.progresso div { height: 100%; width: 0; background: var(--verde); border-radius: 99px; transition: width 0.3s; }
.tempo { height: 8px; background: var(--pannello); border-radius: 99px; overflow: hidden; }
.tempo div { height: 100%; width: 100%; background: var(--arancio); }
.tempo.poco div { background: var(--rosso); }
.scheda { display: flex; flex-direction: column; gap: 14px; background: var(--pannello); border: 2px solid var(--bordo); border-radius: 20px; padding: 16px; min-width: 0; }
.chip { align-self: flex-start; font-family: var(--display); font-size: 0.75rem; letter-spacing: 0.08em; padding: 4px 10px; border-radius: 99px; background: var(--viola); color: #fff; }
.consegna { font-size: 1.15rem; font-weight: 800; }
pre.codice, .riga-codice {
    margin: 0; padding: 12px; background: var(--codice); border: 2px solid var(--bordo); border-radius: 12px;
    font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0;
}
pre.codice .dim { color: var(--tenue); opacity: 0.75; }
.buco { color: var(--giallo); background: rgba(255, 212, 0, 0.14); border-bottom: 2px solid var(--giallo); padding: 0 3px; border-radius: 3px; }
.domanda { font-weight: 600; }
.aiuto { color: var(--giallo); font-size: 0.9rem; }
.aiuto::before { content: "AIUTO · "; font-family: var(--display); font-size: 0.75rem; }
input.risposta, textarea.risposta {
    width: 100%; padding: 12px; font-family: var(--mono); font-size: 16px;
    color: var(--testo); background: var(--codice); border: 2px solid var(--bordo); border-radius: 12px;
}
textarea.risposta { min-height: 180px; resize: vertical; line-height: 1.5; tab-size: 4; }
.righe { display: flex; flex-direction: column; gap: 8px; }
.riga {
    text-align: left; font-family: var(--mono); font-size: 0.8rem; line-height: 1.45;
    padding: 10px 12px; background: var(--codice); color: var(--testo);
    border: 2px solid var(--bordo); border-radius: 12px; box-shadow: 0 4px 0 #07020a;
    white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer; margin-bottom: 4px;
}
.riga:active { transform: translateY(4px); box-shadow: none; }
.riga.scelta { border-color: var(--giallo); background: #2a2300; }
.zona { min-height: 56px; padding: 8px; border: 2px dashed var(--bordo); border-radius: 14px; display: flex; flex-direction: column; gap: 6px; }
.zona:empty::before { content: "Tocca le righe qui sotto nell'ordine giusto"; color: var(--tenue); font-size: 0.85rem; padding: 8px; }
.zona .riga { border-color: var(--verde-ombra); }

/* ---------- foglio esito ---------- */
#foglio {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    border-radius: 22px 22px 0 0; max-height: 82vh; overflow-y: auto;
    animation: sale 0.22s ease-out;
}
#foglio .dentro { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
#foglio.verde { background: #0b3a1d; border-top: 4px solid var(--verde); }
#foglio.rosso { background: #4a0716; border-top: 4px solid var(--rosso); }
#foglio .esito { font-family: var(--display); font-size: 1.7rem; line-height: 1.05; }
#foglio.verde .esito { color: var(--verde); }
#foglio.rosso .esito { color: #fff; text-shadow: 0 0 18px var(--rosso); }
#foglio .insulto { display: inline-block; animation: botta 0.6s cubic-bezier(.2, 1.6, .4, 1) both; }
#foglio .motivo { animation: appare 0.3s 0.45s both; }
#foglio .motivo b { font-family: var(--display); font-weight: 400; font-size: 0.8rem; letter-spacing: 0.06em; display: block; margin-bottom: 2px; }
#foglio.rosso .motivo b { color: var(--giallo); }
#foglio.verde .motivo b { color: var(--verde); }
#foglio .riga-codice { border-color: rgba(255, 255, 255, 0.18); }
#foglio .xpvinti { font-family: var(--display); color: var(--giallo); }
.mancanti { color: var(--giallo); }
@keyframes sale { from { transform: translateY(100%); } to { transform: none; } }
@keyframes botta {
    0% { transform: scale(3) rotate(-12deg); opacity: 0; }
    55% { transform: scale(0.9) rotate(4deg); opacity: 1; }
    70% { transform: translateX(-8px) rotate(-3deg); }
    85% { transform: translateX(8px) rotate(2deg); }
    100% { transform: none; }
}
@keyframes appare { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes trema { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.trema { animation: trema 0.25s 2; }

/* ---------- schermate di fine e boss ---------- */
.grande { font-family: var(--display); font-size: clamp(3rem, 18vw, 5rem); line-height: 1; }
.grande.verde { color: var(--verde); }
.grande.rosso { color: var(--rosso); }
.statistiche { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.statistiche div { background: var(--pannello-2); border-radius: 12px; padding: 10px; text-align: center; }
.statistiche b { display: block; font-family: var(--display); font-size: 1.3rem; color: var(--giallo); font-weight: 400; }
.statistiche span { font-size: 0.75rem; color: var(--tenue); }
.orologio { font-family: var(--display); font-size: 2rem; color: var(--arancio); font-variant-numeric: tabular-nums; }
.orologio.poco { color: var(--rosso); }
#editor { min-height: 60vh; white-space: pre; overflow-x: auto; overflow-wrap: normal; font-size: 13px; }
.griglia { display: flex; flex-direction: column; gap: 6px; padding: 0; margin: 0; list-style: none; }
.griglia li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--pannello-2); min-width: 0; }
.griglia .si { color: var(--verde); font-family: var(--display); }
.griglia .no { color: var(--rosso); font-family: var(--display); }
.griglia code { display: block; margin-top: 4px; font-size: 0.75rem; color: var(--giallo); white-space: pre-wrap; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition: none !important; }
}
</style>
</head>

    <header class="barra" id="barra">
        <span class="vite" id="vite" aria-label="Vite"></span>
        <span class="combo" id="combo" data-n="0">x0</span>
        <span class="xp" id="xp">0 XP</span>
        <button class="esci" id="esci" type="button" hidden>Esci</button>
    </header>

    <section id="home"></section>
    <section id="gioco" hidden></section>
    <section id="boss" hidden></section>
    <section id="fine" hidden></section>
</div>

)","writeHead\\(\\s*400"],"riga":"res.writeHead(400, { 'Content-Type': 'text/html; charset=utf-8' });"},{"nome":"controllo su utenti e 401","re":["utenti","writeHead\\(\\s*401"],"riga":"res.writeHead(401, { 'Content-Type': 'text/html; charset=utf-8' });"},{"nome":"Content-Type text/html con charset","re":["Content-Type[\"'`]?\\s*:\\s*[\"'`]text\\/html;\\s*charset=utf-8"],"riga":"res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });"},{"nome":"escape di & e <","re":["&amp;","&lt;","\\.replace\\("],"riga":".replace(/<\/g, \"&lt;\")"},{"nome":"end() su ogni ramo (end + pipe ≥ writeHead)","tipo":"conta","piu":"\\.end\\(|\\.pipe\\(\\s*res\\s*\\)","meno":"writeHead\\(","riga":"res.end(\"...\");  // dopo ogni writeHead"}]}}</script>
<script>
"use strict";
const DATI = JSON.parse(document.getElementById("dati").textContent);
const CHIAVE = "tep-login-v1";
const INSULTI = ["STRONZO!", "STUDIA!", "MA CHE CAZZO SCRIVI?", "COGLIONE!", "STUDIA, ASINO!", "PORCA TROIA, NO!", "VERGOGNATI!", "TORNA SULLE SLIDE, STRONZO", "SVEGLIA, STRONZO!", "SCEMO!"];
const NOMI_TIPO = { completa: "COMPLETA LA RIGA", riordina: "RIORDINA", errore: "TROVA L'ERRORE", prevedi: "PREVEDI", blocco: "SCRIVI IL BLOCCO" };
const SECONDI = { completa: 45, riordina: 75, errore: 45, prevedi: 40, blocco: 150 };

const $ = function (id) { return document.getElementById(id); };
const tutti = [];
DATI.livelli.forEach(function (l) { l.esercizi.forEach(function (e) { e.livello = l.n; tutti.push(e); }); });
const perId = {};
tutti.forEach(function (e) { perId[e.id] = e; });

// ---------- salvataggio (localStorage può mancare: il gioco funziona lo stesso) ----------
function statoBase() { return { sbloccato: 1, xp: 0, completati: [], sbagliati: [], bossMigliore: null }; }
function carica() {
    try {
        const s = JSON.parse(localStorage.getItem(CHIAVE));
        if (s && typeof s === "object") return Object.assign(statoBase(), s);
    } catch (e) { /* storage bloccato: si riparte da zero */ }
    return statoBase();
}
function salva() {
    try { localStorage.setItem(CHIAVE, JSON.stringify(stato)); } catch (e) { /* storage bloccato */ }
}
let stato = carica();

// ---------- confronto: spazi ignorati, ' " ` equivalenti, la sintassi conta ----------
function norm(s, minuscole) {
    const t = String(s).replace(/\s+/g, "").replace(/['"`]/g, '"');
    return minuscole ? t.toLowerCase() : t;
}
function righeCodice(testo) {
    return String(testo).split("\n").map(function (r) { return r.trim(); })
        .filter(function (r) { return r !== "" && !r.startsWith("//"); });
}
function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function mescola(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
}
function rigaGiusta(es) {
    if (es.tipo === "completa") return (es.prima || []).concat([es.testo.replace("___", es.risposta[0])]).join("\n");
    if (es.tipo === "riordina") return es.righe.join("\n");
    if (es.tipo === "errore") return es.corretta;
    if (es.tipo === "blocco") return es.soluzione;
    return es.risposta[0];
}

// ---------- schermate ----------
function mostra(id) {
    ["home", "gioco", "boss", "fine"].forEach(function (s) { $(s).hidden = s !== id; });
    $("esci").hidden = id === "home";
    window.scrollTo(0, 0);
}
function aggiornaBarra() {
    const v = partita && partita.modo === "livello" ? partita.vite : 3;
    let cuori = "";
    for (let i = 0; i < 3; i++) cuori += i < v ? "♥" : '<span class="persa">♥</span>';
    $("vite").innerHTML = partita && partita.modo === "ripasso" ? '<span style="color:var(--viola)">RIPASSO</span>' : cuori;
    const c = partita ? partita.combo : 0;
    $("combo").textContent = "x" + c;
    $("combo").dataset.n = c;
    $("xp").textContent = stato.xp + " XP";
}

function home() {
    fermaTimer();
    partita = null;
    aggiornaBarra();
    const fatti = stato.completati.length;
    let html = '<div class="titolo"><span class="occhiello">TEP · verifica pratica · Node.js</span>' +
        '<h1>Login <span>da 10</span></h1>' +
        '<p>Sette livelli nell\'ordine in cui scrivi il codice, poi il Boss: tutto server.js da zero in 15 minuti.</p></div>' +
        '<div class="mappa">';
    DATI.livelli.forEach(function (l) {
        const fatto = stato.completati.indexOf(l.n) >= 0;
        const aperto = l.n <= stato.sbloccato;
        html += '<button type="button" class="tappa' + (fatto ? " fatta" : "") + '" data-livello="' + l.n + '"' + (aperto ? "" : " disabled") + '>' +
            '<span class="num">' + l.n + '</span><span><span class="nome">' + esc(l.titolo) + '</span><span class="sotto">' + esc(l.sottotitolo) + ' · ' + l.esercizi.length + ' esercizi</span></span>' +
            '<span class="stato">' + (fatto ? "FATTO" : aperto ? "GIOCA" : "CHIUSO") + '</span></button>';
    });
    const bossAperto = stato.sbloccato >= 8;
    const bossFatto = stato.completati.indexOf(8) >= 0;
    html += '<button type="button" class="tappa boss' + (bossFatto ? " fatta" : "") + '" data-livello="8"' + (bossAperto ? "" : " disabled") + '>' +
        '<span class="num">8</span><span><span class="nome">BOSS: server.js</span><span class="sotto">15 minuti, ' + DATI.boss.griglia.length + ' controlli' +
        (stato.bossMigliore !== null ? " · record " + stato.bossMigliore + "%" : "") + '</span></span>' +
        '<span class="stato">' + (bossFatto ? "BATTUTO" : bossAperto ? "SFIDA" : "CHIUSO") + '</span></button></div>';
    const nSbagli = stato.sbagliati.length;
    html += '<div class="azioni"><button type="button" class="btn viola largo" id="ripasso"' + (nSbagli ? "" : " disabled") + '>Ripasso finale · ' + nSbagli + (nSbagli === 1 ? ' sbagliato' : ' sbagliati') + '</button>' +
        '<p style="color:var(--tenue);font-size:.85rem;text-align:center">' + fatti + ' livelli su 8 · i progressi restano su questo telefono</p>' +
        '<button type="button" class="azzera" id="azzera">Azzera i progressi</button></div>';
    $("home").innerHTML = html;
    $("home").querySelectorAll(".tappa").forEach(function (b) {
        b.addEventListener("click", function () {
            const n = Number(b.dataset.livello);
            if (n === 8) bossIntro(); else iniziaLivello(n);
        });
    });
    $("ripasso").addEventListener("click", iniziaRipasso);
    $("azzera").addEventListener("click", function () {
        const b = $("azzera");
        if (b.dataset.sicuro) { stato = statoBase(); salva(); home(); return; }
        b.dataset.sicuro = "1";
        b.textContent = "Tocca di nuovo per cancellare tutto";
    });
    mostra("home");
}

// ---------- partita ----------
let partita = null;
function iniziaLivello(n) {
    const l = DATI.livelli[n - 1];
    const blocchi = l.esercizi.filter(function (e) { return e.tipo === "blocco"; });
    const altri = l.esercizi.filter(function (e) { return e.tipo !== "blocco"; });
    // mescolati, ma il blocco intero chiude il livello
    partita = { modo: "livello", livello: n, coda: mescola(altri).concat(blocchi), totale: l.esercizi.length, fatti: 0, vite: 3, combo: 0, errori: 0, xp: 0 };
    prossimo();
}
function iniziaRipasso() {
    const lista = stato.sbagliati.map(function (id) { return perId[id]; }).filter(Boolean);
    if (!lista.length) return;
    partita = { modo: "ripasso", livello: 0, coda: mescola(lista), totale: lista.length, fatti: 0, vite: 3, combo: 0, errori: 0, xp: 0 };
    prossimo();
}

let timer = null;
function fermaTimer() { if (timer) { clearInterval(timer.id); timer = null; } }
function avviaTimer(secondi) {
    fermaTimer();
    const fine = Date.now() + secondi * 1000;
    timer = { id: setInterval(function () {
        const resta = Math.max(0, fine - Date.now());
        const barra = document.querySelector("#gioco .tempo");
        if (barra) {
            barra.firstElementChild.style.width = (resta / (secondi * 1000) * 100) + "%";
            barra.classList.toggle("poco", resta < 8000);
        }
        if (resta === 0) { fermaTimer(); valuta(true); }
    }, 100), inizio: Date.now(), secondi: secondi };
}
function secondiPer(es) {
    const fattore = es.livello <= 2 ? 1.5 : es.livello <= 4 ? 1.25 : 1;
    return Math.round((SECONDI[es.tipo] + (es.correggi ? 30 : 0)) * fattore);
}
// meno aiuti salendo: 1-2 aiuto visibile, 3-4 a richiesta, 5 costa XP, 6-7 niente
function testoAiuto(es) {
    if (es.aiuto) return es.aiuto;
    if (es.tipo === "completa") return "Inizia con: " + es.risposta[0].slice(0, 2);
    if (es.tipo === "blocco") return "Prima riga: " + righeCodice(es.soluzione)[0];
    return "";
}

let corrente = null;
let scelte = [];
let selezionata = -1;

function prossimo() {
    aggiornaBarra();
    if (!partita.coda.length) return fineLivello(true);
    corrente = partita.coda[0];
    scelte = [];
    selezionata = -1;
    ordineMescolato = [];
    disegna();
    avviaTimer(secondiPer(corrente));
}

function disegna() {
    const es = corrente;
    const lv = es.livello;
    let h = '<div class="progresso"><div style="width:' + (partita.fatti / partita.totale * 100) + '%"></div></div>' +
        '<div class="scheda" id="esercizio" data-id="' + es.id + '" data-tipo="' + es.tipo + '">' +
        '<div class="tempo"><div></div></div>' +
        '<span class="chip">' + NOMI_TIPO[es.tipo] + ' · LIV ' + lv + '</span>' +
        '<p class="consegna">' + esc(es.consegna) + '</p>';

    if (es.tipo === "completa") {
        const parti = es.testo.split("___");
        h += '<pre class="codice">' + (es.prima || []).map(function (r) { return '<span class="dim">' + esc(r) + '</span>\n'; }).join("") +
            esc(parti[0]) + '<span class="buco">___</span>' + esc(parti[1]) + '</pre>' +
            '<input class="risposta" id="risposta" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="scrivi il pezzo mancante">';
    }
    if (es.tipo === "prevedi") {
        if (es.codice) h += '<pre class="codice">' + esc(es.codice) + '</pre>';
        if (es.http) {
            const body = es.http.bodyLungo ? "nome=" + "a".repeat(24) + "… (" + es.http.bodyLungo + " caratteri)" : (es.http.body || "");
            h += '<pre class="codice">' + esc(es.http.metodo + " " + es.http.url + " HTTP/1.1") + (body ? "\n\n" + esc(body) : "") + '</pre>';
        }
        h += '<p class="domanda">' + esc(es.domanda) + '</p>' +
            '<input class="risposta" id="risposta" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="la tua previsione">';
    }
    if (es.tipo === "riordina") {
        h += '<div class="zona" id="zona"></div><div class="righe" id="pool"></div>';
    }
    if (es.tipo === "errore") {
        h += '<div class="righe">' + es.righe.map(function (r, i) {
            return '<button type="button" class="riga" data-i="' + i + '">' + esc(r) + '</button>';
        }).join("") + '</div>';
        if (es.correggi) h += '<input class="risposta" id="risposta" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="tocca la riga sbagliata, poi correggila qui">';
    }
    if (es.tipo === "blocco") {
        h += '<textarea class="risposta" id="risposta" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="scrivi qui il blocco intero"></textarea>';
    }

    const aiuto = partita.modo === "livello" ? testoAiuto(es) : "";
    if (aiuto && lv <= 2) h += '<p class="aiuto">' + esc(aiuto) + '</p>';
    if (aiuto && (lv === 3 || lv === 4)) h += '<button type="button" class="btn scuro" id="chiedi">Aiuto</button>';
    if (aiuto && lv === 5) h += '<button type="button" class="btn scuro" id="chiedi">Aiuto (-5 XP)</button>';
    h += '<button type="button" class="btn largo" id="controlla">Controlla</button></div>';
    $("gioco").innerHTML = h;
    mostra("gioco");

    if (es.tipo === "riordina") disegnaRiordina();
    if (es.tipo === "errore") {
        $("gioco").querySelectorAll(".riga").forEach(function (b) {
            b.addEventListener("click", function () {
                selezionata = Number(b.dataset.i);
                $("gioco").querySelectorAll(".riga").forEach(function (x) { x.classList.toggle("scelta", x === b); });
                if (es.correggi) { $("risposta").value = es.righe[selezionata]; $("risposta").focus(); }
            });
        });
    }
    const chiedi = $("chiedi");
    if (chiedi) chiedi.addEventListener("click", function () {
        if (lv === 5) { stato.xp = Math.max(0, stato.xp - 5); salva(); aggiornaBarra(); }
        const p = document.createElement("p");
        p.className = "aiuto";
        p.textContent = aiuto;
        chiedi.replaceWith(p);
    });
    $("controlla").addEventListener("click", function () { valuta(false); });
    const input = $("risposta");
    if (input && input.tagName === "INPUT") {
        input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); valuta(false); } });
    }
    if (input && input.tagName === "TEXTAREA") {
        input.addEventListener("keydown", function (e) {
            if (e.key === "Tab") { e.preventDefault(); const s = input.selectionStart; input.setRangeText("    ", s, input.selectionEnd, "end"); }
        });
    }
}

let ordineMescolato = [];
function disegnaRiordina() {
    const es = corrente;
    if (!ordineMescolato.length) {
        do { ordineMescolato = mescola(es.righe.map(function (_, i) { return i; })); }
        while (es.righe.length > 1 && ordineMescolato.every(function (v, i) { return v === i; }));
    }
    $("zona").innerHTML = scelte.map(function (i) { return '<button type="button" class="riga" data-i="' + i + '">' + esc(es.righe[i]) + '</button>'; }).join("");
    $("pool").innerHTML = ordineMescolato.filter(function (i) { return scelte.indexOf(i) < 0; })
        .map(function (i) { return '<button type="button" class="riga" data-i="' + i + '">' + esc(es.righe[i]) + '</button>'; }).join("");
    $("zona").querySelectorAll(".riga").forEach(function (b) {
        b.addEventListener("click", function () { scelte.splice(scelte.indexOf(Number(b.dataset.i)), 1); disegnaRiordina(); });
    });
    $("pool").querySelectorAll(".riga").forEach(function (b) {
        b.addEventListener("click", function () { scelte.push(Number(b.dataset.i)); disegnaRiordina(); });
    });
}

function valuta(scaduto) {
    if (!corrente || $("foglio").hidden === false) return;
    const es = corrente;
    const input = $("risposta");
    const valore = input ? input.value : "";
    let giusto = false;
    let extra = "";

    if (!scaduto) {
        if (es.tipo === "completa") {
            const m = !!es.ignoraMaiuscole;
            giusto = valore.trim() !== "" && es.risposta.some(function (a) {
                return norm(valore, m) === norm(a, m) || norm(valore, m) === norm(es.testo.replace("___", a), m);
            });
        }
        if (es.tipo === "prevedi") {
            giusto = valore.trim() !== "" && es.risposta.some(function (a) { return norm(valore) === norm(a); });
        }
        if (es.tipo === "riordina") {
            if (scelte.length < es.righe.length) { $("zona").classList.add("trema"); setTimeout(function () { $("zona") && $("zona").classList.remove("trema"); }, 600); return; }
            giusto = scelte.every(function (i, k) { return norm(es.righe[i]) === norm(es.righe[k]); });
        }
        if (es.tipo === "errore") {
            if (selezionata < 0) return;
            giusto = selezionata === es.sbagliata && (!es.correggi || norm(valore) === norm(es.corretta));
        }
        if (es.tipo === "blocco") {
            const scritte = righeCodice(valore).map(function (r) { return norm(r); });
            const attese = righeCodice(es.soluzione);
            giusto = scritte.join("") === attese.map(function (r) { return norm(r); }).join("");
            const mancano = attese.filter(function (r) { return scritte.indexOf(norm(r)) < 0; });
            if (!giusto && mancano.length) extra = '<p class="mancanti">Righe mancanti o sbagliate:</p><pre class="riga-codice">' + esc(mancano.join("\n")) + '</pre>';
            if (!giusto && !mancano.length) extra = '<p class="mancanti">Le righe ci sono, ma in ordine diverso o con righe in più.</p>';
        }
    }
    fermaTimer();
    esito(giusto, scaduto, extra);
}

function esito(giusto, scaduto, extra) {
    const es = corrente;
    let h;
    if (giusto) {
        const bonus = 10 + Math.min(partita.combo, 5) * 2;
        partita.combo++;
        partita.xp += bonus;
        stato.xp += bonus;
        partita.fatti++;
        partita.coda.shift();
        if (partita.modo === "ripasso") stato.sbagliati = stato.sbagliati.filter(function (id) { return id !== es.id; });
        h = '<div class="esito">GIUSTO!</div><div class="xpvinti">+' + bonus + ' XP' + (partita.combo > 1 ? ' · COMBO x' + partita.combo : '') + '</div>' +
            '<p class="motivo"><b>PERCHÉ</b>' + esc(es.perche) + '</p>';
        $("foglio").className = "verde";
    } else {
        partita.combo = 0;
        partita.errori++;
        if (partita.modo === "livello") partita.vite--;
        if (stato.sbagliati.indexOf(es.id) < 0) stato.sbagliati.push(es.id);
        // torna più avanti, finché non è giusto
        partita.coda.shift();
        partita.coda.splice(Math.min(2, partita.coda.length), 0, es);
        const insulto = scaduto ? "TEMPO SCADUTO, LUMACA!" : INSULTI[Math.floor(Math.random() * INSULTI.length)];
        h = '<div class="esito"><span class="insulto">' + esc(insulto) + '</span></div>' +
            '<div class="motivo"><b>PERCHÉ</b>' + esc(es.perche) + '</div>' +
            '<div class="motivo"><b>RIGA GIUSTA</b><pre class="riga-codice">' + esc(rigaGiusta(es)) + '</pre></div>' + extra;
        $("foglio").className = "rosso";
    }
    salva();
    aggiornaBarra();
    h += '<button type="button" class="btn largo ' + (giusto ? "" : "rosso") + '" id="continua">Continua</button>';
    $("foglio-dentro").innerHTML = h;
    $("foglio").hidden = false;
    $("continua").focus({ preventScroll: true });
    $("continua").addEventListener("click", function () {
        $("foglio").hidden = true;
        if (partita.modo === "livello" && partita.vite <= 0) return fineLivello(false);
        prossimo();
    });
}

function fineLivello(vinto) {
    fermaTimer();
    corrente = null;
    let h;
    if (partita.modo === "ripasso") {
        h = '<div class="scheda"><span class="chip">RIPASSO FINITO</span><div class="grande verde">PULITO</div>' +
            '<p>Hai sistemato tutti gli esercizi che avevi sbagliato.</p>';
    } else if (vinto) {
        const n = partita.livello;
        if (stato.completati.indexOf(n) < 0) stato.completati.push(n);
        stato.sbloccato = Math.max(stato.sbloccato, n + 1);
        h = '<div class="scheda"><span class="chip">LIVELLO ' + n + ' FATTO</span><div class="grande verde">FATTO!</div>' +
            '<p>' + (n === 7 ? "Il Boss è aperto: tutto server.js in 15 minuti." : "Livello " + (n + 1) + " sbloccato.") + '</p>';
    } else {
        h = '<div class="scheda"><span class="chip" style="background:var(--rosso)">GAME OVER</span><div class="grande rosso">VITE FINITE</div>' +
            '<p>Tre errori. Rileggi i fogli rossi e riprova il livello: gli esercizi sbagliati sono già nel ripasso.</p>';
    }
    h += '<div class="statistiche"><div><b>' + partita.xp + '</b><span>XP</span></div><div><b>' + partita.errori + '</b><span>errori</span></div><div><b>' + partita.fatti + '/' + partita.totale + '</b><span>fatti</span></div></div>';
    if (!vinto && partita.modo === "livello") h += '<button type="button" class="btn arancio largo" id="riprova">Riprova il livello</button>';
    h += '<button type="button" class="btn largo" id="mappa">Torna alla mappa</button></div>';
    salva();
    $("fine").innerHTML = h;
    mostra("fine");
    const riprova = $("riprova");
    const n = partita.livello;
    if (riprova) riprova.addEventListener("click", function () { iniziaLivello(n); });
    $("mappa").addEventListener("click", home);
}

// ---------- Boss ----------
let bossTimer = null;
function bossIntro() {
    partita = null;
    aggiornaBarra();
    $("boss").innerHTML = '<div class="scheda"><span class="chip" style="background:var(--rosso)">BOSS</span><h2>Tutto server.js, da zero</h2>' +
        '<p>Hai ' + DATI.boss.minuti + ' minuti. Nessun aiuto. Alla consegna, ' + DATI.boss.griglia.length + ' controlli sul testo: ti dico il punteggio e le righe che mancano. Per batterlo serve almeno il ' + DATI.boss.soglia + '%.</p>' +
        '<button type="button" class="btn rosso largo" id="via">Via, parte il tempo</button></div>';
    mostra("boss");
    $("via").addEventListener("click", bossVia);
}
function bossVia() {
    $("boss").innerHTML = '<div class="scheda"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="chip" style="background:var(--rosso)">BOSS</span><span class="orologio" id="orologio">15:00</span></div>' +
        '<textarea class="risposta" id="editor" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="const http = require(&quot;http&quot;);"></textarea>' +
        '<button type="button" class="btn largo" id="consegna">Consegna</button></div>';
    const fine = Date.now() + DATI.boss.minuti * 60000;
    const ed = $("editor");
    ed.addEventListener("keydown", function (e) {
        if (e.key === "Tab") { e.preventDefault(); const s = ed.selectionStart; ed.setRangeText("    ", s, ed.selectionEnd, "end"); }
    });
    clearInterval(bossTimer);
    bossTimer = setInterval(function () {
        const resta = Math.max(0, fine - Date.now());
        const m = Math.floor(resta / 60000), s = Math.floor(resta / 1000) % 60;
        const o = $("orologio");
        if (o) { o.textContent = m + ":" + String(s).padStart(2, "0"); o.classList.toggle("poco", resta < 60000); }
        if (resta === 0) bossConsegna();
    }, 250);
    $("consegna").addEventListener("click", bossConsegna);
    ed.focus();
}
function voceOk(c, testo) {
    if (c.tipo === "conta") {
        const quanti = function (re) { return (testo.match(new RegExp(re, "g")) || []).length; };
        return quanti(c.piu) >= quanti(c.meno) && quanti(c.meno) > 0;
    }
    return c.re.every(function (re) { return new RegExp(re).test(testo); });
}
function bossConsegna() {
    clearInterval(bossTimer);
    const testo = $("editor") ? $("editor").value : "";
    const g = DATI.boss.griglia;
    const esiti = g.map(function (c) { return voceOk(c, testo); });
    const punti = esiti.filter(Boolean).length;
    const perc = Math.round(punti * 100 / g.length);
    const battuto = perc >= DATI.boss.soglia;
    stato.bossMigliore = Math.max(stato.bossMigliore || 0, perc);
    if (battuto && stato.completati.indexOf(8) < 0) stato.completati.push(8);
    stato.xp += punti * 5;
    salva();
    aggiornaBarra();
    let h = '<div class="scheda" id="esito-boss" data-perc="' + perc + '"><span class="chip" style="background:var(--' + (battuto ? "verde" : "rosso") + ')">' + (battuto ? "BOSS BATTUTO" : "BOSS TI HA FATTO IL CULO") + '</span>' +
        '<div class="grande ' + (battuto ? "verde" : "rosso") + '" id="percentuale">' + perc + '%</div>' +
        '<p>' + punti + ' controlli su ' + g.length + ' · +' + (punti * 5) + ' XP</p><ul class="griglia">';
    g.forEach(function (c, i) {
        h += '<li><span class="' + (esiti[i] ? "si" : "no") + '">' + (esiti[i] ? "✓" : "✗") + '</span><span>' + esc(c.nome) +
            (esiti[i] ? "" : '<code>' + esc(c.riga) + '</code>') + '</span></li>';
    });
    h += '</ul><button type="button" class="btn arancio largo" id="ancora">Riprova il Boss</button><button type="button" class="btn largo" id="mappa-boss">Torna alla mappa</button></div>';
    $("boss").innerHTML = h;
    window.scrollTo(0, 0);
    $("ancora").addEventListener("click", bossIntro);
    $("mappa-boss").addEventListener("click", home);
}

$("esci").addEventListener("click", function () {
    clearInterval(bossTimer);
    $("foglio").hidden = true;
    home();
});
home();
</script>
